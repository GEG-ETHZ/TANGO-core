# Internal preview of the docs site: everything in docs/, including the
# internal pages the public build excludes (task log, roadmap, archive,
# long-term exploration). It is for local reading only; docs.yml builds it
# as a check but deploys the public build.
#   just docs-internal   → http://127.0.0.1:8000
INHERIT: mkdocs.yml
site_name: TANGO (internal)
site_dir: site-internal
nav:
  - Internal:
      - Task log: tango_tasks.md
      - Vision and roadmap: TANGO_vision_and_roadmap/README.md
      - Long-term architecture: long_term_architecture_exploration.md
      - Bugs found and fixed: archive/bugs-fixed-in-tango.md
      - Where the commandments come from: commandments_provenance.md
      - Aitken speed-up: aitkens_speedup.md
      - TESPy limitations: tespy_limitations.md
      - pymoo generation budget: pymoo_generation_budget.md
      - Walkthrough: walkthrough.md
      - Archive: archive/README.md
      - Running on Euler: guides/euler.md
      - Design notes:
          - Implicit solver: implicit_solver_exploration.md
          - Modelica: modelica-investigation.md
          - Subsurface as TESPy components: TANGO_vision_and_roadmap/subsurface_as_tespy_components.md
          - AI error interpretation: appendices/ai_error_interpretation_sketch.md
plugins:
  - search
  - exclude:
      glob:
        - AGENTS.md
        # fragments written by tools/gen_reference.py, included by snippets
        - "reference/generated/*"
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            merge_init_into_class: true
