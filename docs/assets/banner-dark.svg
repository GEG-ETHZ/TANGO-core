<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="TANGO, Techno-economic ANalysis of Geoenergy Operations. Techno-economic simulation of geothermal energy systems. Reservoir, wells and surface plant coupled in one modular simulator, solved over the project's lifetime, with the levelized cost of electricity or heat.">
  <title>TANGO</title>
  <defs>
    <linearGradient id="word-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#82AEEA"/><stop offset="0.5" stop-color="#B794E0"/><stop offset="1" stop-color="#F08A78"/></linearGradient>
    <linearGradient id="loop-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#82AEEA"/><stop offset="0.5" stop-color="#B794E0"/><stop offset="1" stop-color="#F08A78"/></linearGradient>
  </defs>
  <rect width="1200" height="340" fill="#0E0E10"/>
  <rect y="339" width="1200" height="1" fill="#2A2A2E"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="82" font-size="14" font-weight="600" fill="#A3A39D" letter-spacing="2.2">TECHNO-ECONOMIC ANALYSIS OF GEOENERGY OPERATIONS</text>
    <text x="66" y="176" font-size="96" font-weight="800" letter-spacing="-3.6" fill="url(#word-dark)">TANGO</text>
    <text x="72" y="226" font-size="21" font-weight="600" fill="#EDEDEA" letter-spacing="-0.3">Techno-economic simulation of geothermal energy systems</text>
    <text x="72" y="260" font-size="16.5" font-weight="400" fill="#A3A39D">Reservoir, wells and surface plant coupled in one modular simulator, solved</text>
    <text x="72" y="285" font-size="16.5" font-weight="400" fill="#A3A39D">over the project's lifetime, with the levelized cost of electricity or heat.</text>
  </g>
