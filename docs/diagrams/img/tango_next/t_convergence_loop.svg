<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="460" role="img" aria-label="Flowchart: snapshot convergence state once, then loop restore/mark-stale/solve/wire for every component up to 20 times, check injection temperature, and finish when converged" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"></rect>

  <!-- Step 1: snapshot -->
  <rect x="40" y="20" width="640" height="64" rx="8" fill="#ffffff" stroke="#3c4550" stroke-width="1.4"></rect>
  <text x="60" y="42" font-size="10" letter-spacing="0.05em" fill="#5b6472">ONCE, BEFORE ITERATING</text>
  <text x="60" y="62" font-size="13.5" font-weight="700" fill="#14181d">snapshot_convergence_state()</text>
  <text x="60" y="78" font-size="10.5" fill="#5b6472">every component deep-copies its own cross-timestep fields (t_d_old, energy_extracted, ever_solved, ...)</text>

  <path d="M360,84 V108" stroke="#3c4550" stroke-width="1.6" fill="none" marker-end="url(#arrowMain)"></path>

  <!-- Step 2: inner loop box -->
  <rect x="40" y="112" width="640" height="128" rx="8" fill="#dcece9" fill-opacity="0.35" stroke="#21787a" stroke-width="1.4" stroke-dasharray="4 3"></rect>
  <text x="60" y="134" font-size="10" letter-spacing="0.05em" fill="#21787a">REPEAT &#8212; UP TO 20 TIMES, FOR EACH COMPONENT IN CIRCUIT ORDER</text>
  <text x="60" y="152" font-size="11" font-weight="700" fill="#14181d">every component &#8212; reservoir included, no exceptions</text>

  <!-- inner chain pills -->
  <g font-size="11.5">
    <rect x="60" y="164" width="172" height="28" rx="14" fill="#ffffff" stroke="#d7dbd6" stroke-width="1"></rect>
    <text x="146" y="182" text-anchor="middle" fill="#14181d">restore_convergence_state()</text>
    <text x="240" y="182" fill="#5b6472">&#8594;</text>

    <rect x="256" y="164" width="140" height="28" rx="14" fill="#ffffff" stroke="#d7dbd6" stroke-width="1"></rect>
    <text x="326" y="182" text-anchor="middle" fill="#14181d">mark_all_stale()</text>
    <text x="404" y="182" fill="#5b6472">&#8594;</text>

    <rect x="420" y="164" width="78" height="28" rx="14" fill="#ffffff" stroke="#c1501f" stroke-width="1.4"></rect>
    <text x="459" y="182" text-anchor="middle" fill="#c1501f" font-weight="700">solve()</text>
    <text x="506" y="182" fill="#5b6472">&#8594;</text>

    <rect x="522" y="164" width="146" height="28" rx="14" fill="#ffffff" stroke="#d7dbd6" stroke-width="1"></rect>
    <text x="595" y="182" text-anchor="middle" fill="#14181d">wire outlet &#8594; next inlet</text>
  </g>

  <text x="60" y="216" font-size="10.5" fill="#5b6472">Restoring first means this attempt starts clean from last timestep's real state &#8212;</text>
  <text x="60" y="230" font-size="10.5" fill="#5b6472">not from whatever the previous attempt left behind.</text>

  <path d="M360,240 V264" stroke="#3c4550" stroke-width="1.6" fill="none" marker-end="url(#arrowMain)"></path>

  <!-- Step 3: decision diamond -->
  <text x="60" y="260" font-size="10" letter-spacing="0.05em" fill="#5b6472">AFTER ONE FULL CIRCUIT PASS</text>
  <polygon points="360,266 460,306 360,346 260,306" fill="#ffffff" stroke="#3c4550" stroke-width="1.5"></polygon>
  <text x="360" y="302" text-anchor="middle" font-size="12" fill="#14181d">|&#916;T_inj| &lt;</text>
  <text x="360" y="317" text-anchor="middle" font-size="12" fill="#14181d">0.5 K?</text>

  <!-- no branch: loop back -->
  <path d="M260,306 H180 V176 H40" stroke="#a83f3f" stroke-width="1.6" fill="none" marker-end="url(#arrowNo)"></path>
  <text x="70" y="168" font-size="10.5" font-weight="700" fill="#a83f3f">no</text>
  <text x="44" y="328" font-size="9.5" fill="#a83f3f">loop back to the top with</text>
  <text x="44" y="340" font-size="9.5" fill="#a83f3f">the new guess (max 20&#215;)</text>

  <!-- yes branch: down to final -->
  <path d="M360,346 V370" stroke="#2f7d4f" stroke-width="1.6" fill="none" marker-end="url(#arrowYes)"></path>
  <text x="374" y="362" font-size="10.5" font-weight="700" fill="#2f7d4f">yes</text>

  <!-- Step 4: final box -->
  <rect x="160" y="374" width="400" height="70" rx="8" fill="#2f7d4f" fill-opacity="0.1" stroke="#2f7d4f" stroke-width="1.6"></rect>
  <text x="180" y="396" font-size="10" letter-spacing="0.05em" fill="#2f7d4f">NO CORRECTION PASS NEEDED</text>
  <text x="180" y="415" font-size="12.5" font-weight="700" fill="#2f7d4f">this iteration's state is the final answer</text>
  <text x="180" y="431" font-size="10.5" fill="#2f7d4f">Already used the converged temperature and the correct snapshot restore.</text>

  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4550"></path>
    </marker>
    <marker id="arrowNo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a83f3f"></path>
    </marker>
    <marker id="arrowYes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"></path>
    </marker>
  </defs>
</svg>
