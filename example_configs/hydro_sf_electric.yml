# tango format — flexible Single-Flash system, manual mass flow rate
#
# Structural changes from the old format:
#   - No top-level graph: section; topology is encoded per component as
#     component_idx / prev / next
#   - props: renamed to common:
#   - All component parameters live inside components.<name>.*
#   - surface contains a nested power_plant: block
#   - component_idx 0 is just the first component solved each pass — it has
#     no special BC semantics; it happens to be the surface in this example
#     because that's where the circuit was cut to start the solve order.
#
# Component circuit (main loop):
#   injection_well(0) →[1]→ reservoir(1) →[2]→ production_well_lower(2)
#                     →[3]→ production_well_upper(3) →[4]→ surface(4) →[0]→ injection_well(0)

title: Hydrothermal system with flexible Single-Flash power plant and manual flow rate

description:
  summary: Flagship single-flash example — canonical config other apps/tests build on
  date: "2026-09-18"
  description: >
    Manual mass-flow-rate single-flash hydrothermal system, doublet well
    pattern. This is the config most other apps and tests treat as the
    "known-good starting point": demo_hydro_sf_electric,
    demo_well_mesh_convergence, opt_hydro_sf_electric, and
    test_lcoe_regression.py's REFERENCE_LCOE all build on it directly.
# Orchestrator is selected automatically:
#   sim_config.injection_mode present  →  SystemBCIteration
#   sim_config.injection_mode absent   →  SystemDirect
# External tool type (e.g. CMG) is indicated by the reservoir component's type field.

common:  # shared physical parameters (previously props:)
  fluid_name: H2O
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg·K)
  rock_k: 2.1                # W/(m·K)
  thermal_gradient: 0.035    # K/m
  surface_temperature: 288   # K — ambient
  surface_pressure: 100_000  # Pa — ambient

layout:  # well-field geometry
  well_spacing: 707.0        # m
  well_pattern: DOUBLET
  well_pattern_dimens: [1, 1]

sim_config:
  num_tsteps: 20
  dt_years: 1.0              # years
  target_extraction_pressure: 7_000_000  # Pa — SINGLE shared source; threaded to
                                          # any component declaring this field
                                          # (surface, pump-bearing production wells)
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check | auto-pressure | auto-flow | auto-both
  mass_rate: 50              # kg/s — omit (or ignored) for auto-flow and auto-both
  bc_checkpoint_idx: 4       # component_idx of the BC checkpoint (surface); must match surface.component_idx below

economic:
  type: doublet
  project_maturity: green_field  # green_field or brown_field
  discount_rate: 0.095
  main_product: electricity      # matches MainProduct's own default -- explicit rather than implicit

components:

  surface:
    type: surface
    variant: graph
    component_idx: 4          # solved last (surface consumes production well output)
    prev: 3
    next: 0
    injection_pressure: 2_000_000   # Pa — initial guess for bc_iteration solver
    pipe_diameter: 0.41        # m
    approach_temperature: 7.0  # K
    pipe_roughness: 55.e-6     # m — absolute pipe wall roughness

    power_plant:
      # Single-Flash TESPy topology, read generically by GraphSurface — see
      # components/surface/graph.py module docstring for the inlet/outlet/
      # role naming contract this depends on.
      #
      # Source("inlet") -> Valve -> DropletSeparator -(liquid)-> Compressor(brine_pump) -\
      #                                              \-(vapor)-> Turbine -> SimpleHeatExchanger(condenser) -> Compressor(condensate_pump) -> Merge -> Sink("outlet")
      nodes:
        inlet:
          type: Source

        flash_valve:
          type: Valve
          p_out_megapascals: 0.05          # MPa (= 0.5 bar)

        separator:
          type: DropletSeparator

        brine_pump:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.005         # MPa (= 0.05 bar)

        condenser:
          type: SimpleHeatExchanger
          p_out_megapascals: 0.005         # MPa (= 0.05 bar)
          vapor_mass_fraction_out: 0          # dimensionless [0-1] — TESPy vapor quality x (0 = saturated liquid, 1 = saturated vapor)
          # Cost-only metadata (DoubletEconomicComponent, ignored by GraphSurface's
          # physics): a singleton set (no paired cooler), closed/wet cooling tower.
          Subtype: condenser
          set_number: 1
          design: closed
          cooling_tower_mode: WET

        condensate_pump:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        reinjection_mixer:
          type: Merge

        outlet:
          type: Sink

      edges:
        '1': {source: inlet, target: flash_valve}
        '2': {source: flash_valve, target: separator}
        '3': {source: separator, target: brine_pump, source_port: out1}    # liquid branch
        '4': {source: separator, target: turbine, source_port: out2}  # vapor branch
        '5': {source: turbine, target: condenser}
        '6': {source: condenser, target: condensate_pump}
        '7': {source: condensate_pump, target: reinjection_mixer, target_port: in1}     # condensate
        '8': {source: brine_pump, target: reinjection_mixer, target_port: in2}    # separator liquid
        '9': {source: reinjection_mixer, target: outlet}

  injection_well:
    type: injection_well
    variant: numerical           # discretized marching solver; "lumped" = LumpedInjectionWell (single closed-form calc)
    component_idx: 0          # first component solved each pass — circuit cut here
    prev: 4
    next: 1
    well_length: 5000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 5000.0       # m
    thickness: 300.0              # m
    permeability: 5.0e-14         # m2 (~50 mD)
    porosity: 0.1
    hydro_static_pressure: 50_000_000  # Pa — nominal, used only for the fracking-safety ceiling
    over_pressure_percentage: 10
    brine_density: 1000           # kg/m3 — used for the reservoir's own
                                   # initial/undepleted pressure (brine_density * g * depth)
    well_eff_diameter: 0.410      # m — average of injection (0.410) and production (0.410) well diameters

  production_well_lower:
    type: production_well
    variant: numerical           # discretized marching solver; "lumped" = LumpedProductionWell (single closed-form calc)
    component_idx: 2
    prev: 1
    next: 3
    well_length: 4000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    wellhead_depth: 1000.0    # m — equals the well's own length (pump_well_length)

  production_well_upper:
    type: production_well_with_pump
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 1000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    pump_efficiency: 0.55          # overall ESP string efficiency, van 't Spijker & Ungemach (2016) -- see docs/SOURCES.md#vantspijker2016
    # target_extraction_pressure is NOT set here — it's sourced from
    # sim_config.target_extraction_pressure above (see that field's
    # docstring in core/specs.py for the duplicated-value bug this fixed).

# TODO: migrate addons section
# The old format had a top-level addons: block (ThermaGraph, Analyzer) that activated
# optional post-processing tools. The original intent was for these to be separate
# installable dependencies with a declared interface. That design was never cleanly
# implemented. In tango, addons should be first-class composable components with
# a defined ABC — not a stringly-typed activation flag. Needs a design decision before
# migrating.
