# Design point: opt_CO2_AGS_direct_heat's Pareto pick (the design closest to the ideal corner),
# design 23 of its outputs/pareto_results.csv (md5 7cc24e8eebd4bdd1a9744559227f9a44),
# recorded in dvc.lock at commit 894a47ed. Decision variables rounded to
# 3 significant figures.
#
# tango format — Advanced Geothermal System (AGS) with CO2 as the working
# fluid, direct-heat (district heating) extraction, hypothetical deepened
# variant of the Triemli site.
#
# NOT the real Triemli site: rock properties/gradient match the real site
# (same as AGS_direct_heat.yml), but the well depths below are a
# hypothetical deepening. Nothing here should be read as a real drilling
# proposal for Triemli.
#
# Same closed-loop subsurface SHAPE as AGS_direct_heat.yml (injection_well
# -> horizontal_well -> production_well -> surface -> back to
# injection_well, no reservoir) -- see that file's module docstring for the
# full subsurface rationale. fluid_name: CO2 instead of H2O -- confirmed by
# CPG_electric.yml's own port that tango's fluid handling is fluid-agnostic,
# no new code needed.
#
# Depth is NOT this site's district-heating depth (3000 m vertical + 707 m
# horizontal), though, for a genuinely different reason than AGS_ORC_electric.yml's own
# deepening (that one needed more TEMPERATURE for its ORC cycle). Here, a
# first draft at the real 3000 m depth ran without crashing but produced
# consistently NEGATIVE net_thermal_W (the district-heating exchanger
# appeared to be adding heat, not extracting it) across a wide sweep of
# both the DH return-temperature target and district_heating_hx's own outlet pressure --
# confirmed by direct run and an independent CoolProp enthalpy check
# (matching TESPy's own solved Q to within noise, ruling out a units/sign
# bug). Root cause: at that depth, the produced fluid's converged (T, P)
# sits uncomfortably close to CO2's actual critical point (Tc=304.13 K,
# Pc=7.38 MPa) -- within ~5-20 K and ~0.3-0.4 MPa of it -- a genuinely
# near-critical regime where enthalpy's sensitivity to pressure becomes
# extreme (property gradients diverge at the critical point itself) and
# stops tracking temperature the way it does for an ordinary fluid state.
# A small, otherwise-unremarkable pressure change through district_heating_hx dominated
# the enthalpy balance there, overwhelming the temperature-driven cooling
# entirely -- a real physics effect, not a bug, but one that makes this
# design point unusable for district-heat extraction as specified. This is
# a distinct failure mode from the near-critical-point SOLVER CRASH found
# elsewhere in this session's CO2/CPG audit (CPG_direct_heat.yml) -- here
# nothing crashes, the physics is just genuinely unusable at that depth.
#
# Deepening the loop, with district_heating_hx's outlet pressure raised
# well clear of CO2's critical pressure (not just its critical
# temperature), moves the design away from the critical point; a direct
# run at 6000 m already gave real, stable net_thermal_W across the full
# 25-year run. This file uses 9000 m (the opt_CO2_AGS_direct_heat Pareto
# pick; see the Design point header). Not claimed as a realistic drilling
# target for the real Triemli site -- illustrative only, same spirit as
# AGS_ORC_electric.yml's own disclaimer.
#
# district_heating_hx's own outlet pressure (12.0 MPa) must not exceed the
# CLOSED LOOP's own natural pressure at the exchanger inlet -- see
# CPG_direct_heat.yml's own documented mistake for why this matters.
# Unlike the reservoir-fed CO2 configs, this closed loop's production_well
# pressure is genuinely coupled to the surface plant's own downstream
# choices (a real feedback loop, not an independent quantity), so the
# margin has to hold across the whole run, not just at t=0. At this design
# point the margin is about zero: per opt_CO2_AGS_direct_heat's
# DEFAULT_BOUNDS notes, the exchanger's outlet already equals its inlet
# pressure here, and a higher outlet would be a pressure rise across a
# component that does no work (PassivePressureRiseError).

title: Advanced Geothermal System (AGS) with CO2, direct-heat, hypothetical deepened Triemli-like site

common:
  fluid_name: CO2
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  # well_spacing: derived: equals horizontal_well.well_length (the wellheads are a loop length apart) (see tango.workflows.linked_quantities)

sim_config:
  num_tsteps: 25              # 25 years of operation
  dt_years: 1.0                # years
  target_extraction_pressure: 8_000_000  # Pa — INERT for this topology (plain
                                          # production_well, no pump) -- kept
                                          # for consistency, matching every
                                          # other CO2 config.
  injection_mode: manual       # see AGS_direct_heat.yml's module docstring: required
                                # even without a reservoir
  mass_rate: 70.0               # kg/s — set by the opt_CO2_AGS_direct_heat Pareto pick; see header
  bc_checkpoint_idx: 3           # component_idx of the surface (below)

economic:
  # Same CAPEX-coverage caveat as every other direct-heat example: the
  # district-heating exchanger has no Subtype: cooler/condenser tag, so
  # CAPEX_surface_plant is 0.0 here (real, not a crash).
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: heat

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0           # circuit entry — where the solve pass begins each timestep
    prev: 3
    next: 1
    well_length: 9000          # m — vertical well depth (hypothetically deepened, see header comment)
    diameter: 0.212             # m  (~8-inch casing)
    pipe_roughness: 5.5e-5      # m

  horizontal_well:
    type: horizontal_well
    variant: numerical
    component_idx: 1
    prev: 0
    next: 2
    well_length: 8000           # m — horizontal loop flow-path length
    diameter: 0.75               # m
    pipe_roughness: 5.5e-5       # m
    # wellhead_depth: derived: equals injection_well.well_length (see tango.workflows.linked_quantities)
    angle_from_vert_deg: 90       # fully horizontal — see components/well/numerical.py

  production_well:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    # well_length: derived: equals injection_well.well_length (see tango.workflows.linked_quantities)
    diameter: 0.212              # m
    pipe_roughness: 5.5e-5       # m

  surface:
    type: surface
    variant: graph
    component_idx: 3            # solved last, loops back to injection_well (next: 0)
    prev: 2
    next: 0
    injection_pressure: 7_380_000    # Pa — at CO2's 7.38 MPa critical pressure; set by the
                                     # opt_CO2_AGS_direct_heat Pareto pick (see header comment
                                     # for why the near-critical region matters here).
    pipe_diameter: 0.286              # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m

    power_plant:
      # Direct-heat surface plant, same shape as AGS_direct_heat.yml's own
      # (district_heating_hx + circulation_control). district_heating_hx uses an ABSOLUTE
      # p_out_megapascals (not AGS_direct_heat.yml's pressure_ratio: 0.99)
      # for the same CO2-TESPy-initial-guess reason as every other CO2
      # config in this matrix -- see header comment for how this specific
      # value relates to the closed loop's natural pressure.
      nodes:
        inlet:
          type: Source
        district_heating_hx:
          type: SimpleHeatExchanger
          role: net_thermal
          T_out: 323.15    # K (50 degC) — district-heating return / re-injection temperature
          p_out_megapascals: 12.0 # MPa -- see header comment for the margin to the loop's natural pressure.
        circulation_control:
          type: PumpOrValve
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
        outlet:
          type: Sink
      edges:
        '1': {source: inlet, target: district_heating_hx}
        '2': {source: district_heating_hx, target: circulation_control}
        '3': {source: circulation_control, target: outlet}
