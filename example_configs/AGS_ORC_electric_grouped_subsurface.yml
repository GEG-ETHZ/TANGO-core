# tango format — AGS_ORC_electric.yml with its subsurface loop configured as
# ONE grouped_subsurface component (variant: numerical) instead of three separate
# well components. Everything else (site, surface plant, economics) is
# identical, and so are the results: this is the config the grouped_subsurface
# component is checked against, and the template for its other variants
# (e.g. raft). See AGS_ORC_electric.yml for the design rationale.

title: Advanced Geothermal System (AGS), binary (ORC) power extraction, hypothetical deepened Triemli-like site, subsurface as one grouped_subsurface component

common:
  fluid_name: H2O
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  # well_spacing: derived: equals horizontal_well.well_length (the wellheads are a loop length apart) (see tango.workflows.linked_quantities)

sim_config:
  num_tsteps: 25              # 25 years of operation
  dt_years: 1.0                # years
  target_extraction_pressure: 7_000_000  # Pa — SINGLE shared source; threaded to
                                          # any component declaring this field
                                          # (surface, pump-bearing production wells)
  injection_mode: manual       # see AGS_direct_heat.yml's module docstring: required
                                # even without a reservoir
  mass_rate: 30                 # kg/s — matches AGS_direct_heat.yml's subsurface loop
  bc_checkpoint_idx: 1           # component_idx of the surface (below)

economic:
  # Computed by DoubletEconomicComponent, but scoped/verified against the
  # DOUBLET + turbine/pump/condenser topology (hydro_df_electric.yml), not
  # this one — see that component's module docstring for the full scope.
  # Unlike AGS_direct_heat.yml, this surface plant's turbine/pump/condenser
  # nodes ARE tagged the same way hydro_df_electric.yml's are, so CAPEX
  # coverage should be more complete here than in the direct-heat sibling.
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: electricity

components:

  grouped_subsurface:
    # The whole subsurface loop as one component (see
    # tango.components.well.grouped_subsurface): the same three wells as
    # AGS_ORC_electric.yml's injection_well/horizontal_well/production_well,
    # marched in sequence inside it.
    type: grouped_subsurface
    variant: numerical
    component_idx: 0           # circuit entry — where the solve pass begins each timestep
    prev: 1
    next: 1
    injection_well:
      well_length: 8000.0        # m — vertical well depth (hypothetically deepened, see AGS_ORC_electric.yml)
      diameter: 0.311             # m  (~12-inch casing)
      pipe_roughness: 5.5e-5      # m
    horizontal_well:
      well_length: 3000.0          # m — horizontal loop flow-path length
      diameter: 0.311              # m
      pipe_roughness: 5.5e-5       # m
      # wellhead_depth: derived: equals injection_well.well_length (see tango.workflows.linked_quantities)
    production_well:
      # well_length: derived: equals injection_well.well_length (see tango.workflows.linked_quantities)
      diameter: 0.311              # m
      pipe_roughness: 5.5e-5       # m

  surface:
    type: surface
    variant: graph
    component_idx: 1            # solved last, loops back to grouped_subsurface (next: 0)
    prev: 0
    next: 0
    injection_pressure: 1_500_000  # Pa — fixed value under injection_mode: manual (see
                                     # sim_config above), matching AGS_direct_heat.yml.
    pipe_diameter: 0.41               # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m
    # well_spacing is NOT set here — it's sourced from layout.well_spacing
    # above (see _PROTECTED_COMPONENT_KEYS in workflows/workflow.py for the
    # duplicated-value bug class this guards against).

    power_plant:
      # Binary (ORC) TESPy topology, identical in shape to
      # hydro_ORC_electric.yml's power_plant (see that file for the full
      # node-by-node rationale): the geofluid loop (Source("inlet") ->
      # evaporator -> preheater -> circulation_control ->
      # Sink("outlet")) transfers heat, at each of two heat exchangers, to a
      # separate closed secondary working-fluid loop (preheater.out2 ->
      # evaporator.out2 -> orc_turbine -> orc_desuperheater -> orc_condenser -> orc_feed_pump -> orc_cycle_closer ->
      # back to preheater.in2) that never mixes with the geofluid.
      # circulation_control replaces hydro_ORC_electric.yml's pump2 —
      # same PumpOrValve role, same reason (AGS's closed loop has no other
      # pressure source — see AGS_direct_heat.yml's comment on this node).
      #
      # No p_out_megapascals on circulation_control, deliberately: same
      # reasoning as AGS_direct_heat.yml's circulation_control — injection_pressure
      # (above) already hard-sets the outlet connection's pressure.
      nodes:
        inlet:
          type: Source

        outlet:
          type: Sink

        evaporator:
          type: HeatExchanger
          ttd_l: 7                     # K — terminal temperature difference (boiler)
          pressure_ratio1: 1.0         # geofluid side — dimensionless
          pressure_ratio2: 1.0         # secondary-fluid side — dimensionless
          h0_out1: 250                 # kJ/kg — TESPy guess value (geofluid outlet enthalpy)
          p0_megapascals_out2: 1.38                # MPa (= 13.8 bar) — TESPy guess value (secondary-fluid outlet pressure)
          vapor_mass_fraction_out2: 1  # dimensionless [0-1] — secondary fluid leaves as saturated vapor

        preheater:
          type: HeatExchanger
          pressure_ratio1: 1.0         # geofluid side — dimensionless
          pressure_ratio2: 1.0         # secondary-fluid side — dimensionless
          vapor_mass_fraction_out2: 0  # dimensionless [0-1] — secondary fluid enters the boiler as saturated liquid
          p0_megapascals_out2: 0.5                 # MPa (= 5 bar) — TESPy guess value (secondary-fluid outlet pressure)
          fluid_out2: R245fa           # secondary (ORC) working fluid — never mixes with the geofluid (common.fluid_name)

        circulation_control:
          # PumpOrValve (not a fixed Compressor): whether this geofluid
          # recirculation point is a real pump or a passive throttle depends
          # on design-point conditions, exactly as AGS_direct_heat.yml's own
          # circulation_control node — see that file's comment for the full
          # rationale (thermosiphon effect, no other pressure source on this
          # closed loop).
          type: PumpOrValve
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        orc_turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.125      # MPa (= 1.25 bar) -- condensing pressure, see orc_condenser

        orc_desuperheater:
          type: SimpleHeatExchanger
          p_out_megapascals: 0.125      # MPa (= 1.25 bar) -- condensing pressure, see orc_condenser
          vapor_mass_fraction_out: 1    # dimensionless [0-1] — TESPy vapor quality x

        orc_condenser:
          type: SimpleHeatExchanger
          # Condensing pressure, set by the site rather than chosen: R245fa
          # saturates at 20.4 degC at 1.25 bar, so the 1 K subcooled outlet
          # (19.4 degC) stays above the cooling limit of surface_temperature +
          # approach_temperature = 11 + 7 = 18 degC.
          p_out_megapascals: 0.125      # MPa (= 1.25 bar)
          subcooling_K: 1.0              # K below saturation: slightly subcooled condensate, so the pump never draws
                                         # exactly saturated liquid (TESPy left the condensate pump's equation
                                         # unconverged at x = 0) and has a margin against cavitation

        orc_feed_pump:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.5        # MPa (= 5 bar)

        orc_cycle_closer:
          type: CycleCloser
          # No config -- purely topological, closes the secondary loop so
          # TESPy can solve it with no open Source/Sink of its own.

      edges:
        # Geofluid (primary, closed AGS) loop
        '1': {source: inlet, target: evaporator, target_port: in1}
        '2': {source: evaporator, source_port: out1, target: preheater, target_port: in1}
        '3': {source: preheater, source_port: out1, target: circulation_control}
        '4': {source: circulation_control, target: outlet}
        # Secondary (ORC working-fluid) loop
        '5': {source: orc_cycle_closer, target: preheater, target_port: in2}
        '6': {source: preheater, source_port: out2, target: evaporator, target_port: in2}
        '7': {source: evaporator, source_port: out2, target: orc_turbine}
        '8': {source: orc_turbine, target: orc_desuperheater}
        '9': {source: orc_desuperheater, target: orc_condenser}
        '10': {source: orc_condenser, target: orc_feed_pump}
        '11': {source: orc_feed_pump, target: orc_cycle_closer}
