# tango format — Enhanced Geothermal System (EGS), direct-heat only.
#
# Ported from applications/run_EGS_direct_heat_sweep/triemli_dh_base.yml (the
# Triemli, Zurich site) combined with two already-proven tango pieces:
# the doublet/reservoir subsurface topology from hydro_sf_electric.yml
# (injection_well -> reservoir -> production_well_lower ->
# production_well_upper) and the district-heating surface plant from
# AGS_direct_heat.yml (a single SimpleHeatExchanger targeting a fixed
# re-injection temperature, no turbine/electricity).
#
# Uses `injection_mode: manual-fracking-check`: mass rate is user-fixed
# every timestep (same single pass as `manual`), but the solved result is
# checked against both fracking thresholds afterward, raising
# FrackingViolationError on violation rather than performing no check at
# all. `auto-flow`/`auto-both` (which solve for mass_rate directly each
# pass, with an optional `max_mass_rate` cap) are also available now —
# switching this config to one of those instead is a design choice worth
# considering later, not something this file needs to resolve.
#
# Site parameters (Triemli, Zurich):
#   surface temperature : 11 degC (284.15 K)
#   thermal gradient     : 35 degC/km (0.035 K/m)
#   fluid                : H2O
#   application          : direct heat only (district heating, no electricity)
#   DH return temp       : 50 degC (re-injection temperature)

title: Enhanced Geothermal System (EGS), direct-heat, Triemli site

common:
  fluid_name: H2O
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)  — typical crystalline basement
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  well_spacing: 500.0        # m — typical for EGS doublet

sim_config:
  num_tsteps: 25              # 25 years of operation
  dt_years: 1.0                # years
  target_extraction_pressure: 7_000_000  # Pa — SINGLE shared source; threaded to
                                          # any component declaring this field
                                          # (surface, pump-bearing production wells)
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check | auto-pressure | auto-flow | auto-both
  mass_rate: 30                 # kg/s
  bc_checkpoint_idx: 4           # component_idx of the surface (below)

economic:
  # Computed by DoubletEconomicComponent, but scoped/verified against the
  # DOUBLET + turbine/pump/condenser topology (hydro_df_electric.yml), not
  # this one — confirmed CAPEX_surface_plant comes back 0.0 here (not a
  # crash): the district-heating exchanger has no Subtype: cooler/condenser
  # tag, so it isn't counted by any of the ported surface-plant cost
  # formulas. CAPEX_total/LCOH below are real but understate true cost
  # (missing the surface heat exchanger's own equipment cost) until a
  # direct-heat-exchanger cost formula is ported. See
  # DoubletEconomicComponent's module docstring for the full scope.
  #
  # KNOWN GAP, 2026-09-21: also missing here (and in EGS_electric.yml,
  # which has the fuller writeup) -- EGS reservoir stimulation cost has
  # never been modeled, in tango or old tango. CAPEX_well above reuses the
  # same formula as a hydrothermal doublet, no stimulation premium.
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: heat

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0           # first component solved each pass — circuit cut here
    prev: 4
    next: 1
    well_length: 3000.0        # m — reservoir depth; updated per depth in sweep
    diameter: 0.311             # m  (~12-inch casing, typical for EGS)
    pipe_roughness: 5.5e-5      # m

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 3000.0       # m — updated per depth in sweep
    thickness: 300.0              # m
    permeability: 1.0e-13         # m2  (~100 mD — moderate EGS)
    porosity: 0.1
    hydro_static_pressure: 29_430_000  # Pa = 1000*9.81*3000 — updated per depth in sweep
    over_pressure_percentage: 5
    well_eff_diameter: 0.311      # m — average of injection/production well diameters (both 0.311)

  production_well_lower:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    well_length: 2400.0         # m = 0.8 x reservoir_depth — updated per depth in sweep
    diameter: 0.311              # m
    pipe_roughness: 5.5e-5       # m
    wellhead_depth: 600.0        # m — matches production_well_upper's well_length below

  production_well_upper:
    type: production_well_with_pump
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 600.0          # m = 0.2 x reservoir_depth — updated per depth in sweep
    diameter: 0.311              # m
    pipe_roughness: 5.5e-5       # m
    # target_extraction_pressure is NOT set here — it's sourced from
    # sim_config.target_extraction_pressure below (see that field's
    # docstring in core/specs.py for the duplicated-value bug this fixed).

  surface:
    type: surface
    variant: graph
    component_idx: 4            # solved last, loops back to injection_well (next: 0)
    prev: 3
    next: 0
    injection_pressure: 1_500_000  # Pa — initial guess for the BC-iteration solver
    pipe_diameter: 0.41               # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m
    # well_spacing is NOT set here — it's sourced from layout.well_spacing
    # above (see _PROTECTED_COMPONENT_KEYS in workflows/workflow.py for the
    # duplicated-value bug class this guards against).

    power_plant:
      # Direct-heat surface plant: produced fluid passes through a
      # district-heating heat exchanger and returns at 50 degC (the
      # re-injection temperature) — no turbine, no electricity. Identical
      # topology to AGS_direct_heat.yml's power_plant block.
      nodes:
        inlet:
          type: Source
        dh_hx:
          type: SimpleHeatExchanger
          role: net_thermal
          T_out: 323.15    # K (50 degC) — district-heating return / re-injection temperature
        outlet:
          type: Sink
      edges:
        '1': {source: inlet, target: dh_hx}
        '2': {source: dh_hx, target: outlet}
