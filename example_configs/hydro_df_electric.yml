# tango format — conventional Hydrothermal system, double-flash electric
# power plant.
#
# Ported from old tango's flexible_DF_manual.yml (removed along with old
# tango; preserved at git tag pre-tango-core-rename-2026-09-18). The
# subsurface (doublet reservoir + pumped production) is identical to
# hydro_sf_electric.yml's —
# same site numbers, reused verbatim — only the surface plant differs: two
# flash stages (droplet_separator1 at the higher pressure, droplet_separator2
# at a lower pressure, per standard double-flash design) each driving their
# own turbine, condensate from both recombined and pumped back to injection
# pressure through two pump stages.
#
# All ten node types below (Source/Sink/Valve/DropletSeparator/Turbine/
# SimpleHeatExchanger/Compressor/Merge) were already registered in
# GraphSurface's _COMPONENT_TYPES before this file was written — this
# topology needed zero new Python code, only YAML composition (see
# dev_docs/TANGO_vision_and_roadmap/README.md's "Surface plant layouts are now
# configuration, not code" point).
#
# Two orphaned Sink nodes from the old-tango YAML (`turbine1_outlet`,
# `gas_flow_sink`) were dropped here — they were declared but never
# referenced by any edge in the original file, so they were dead
# declarations, not part of the actual executed topology.

title: Hydrothermal system with double-flash electric power plant, manual flow rate

common:
  fluid_name: H2O
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m
  surface_temperature: 288   # K — ambient
  surface_pressure: 100_000  # Pa — ambient

layout:
  well_spacing: 707.0        # m
  well_pattern: DOUBLET
  well_pattern_dimens: [1, 1]

sim_config:
  num_tsteps: 20
  dt_years: 1.0              # years
  target_extraction_pressure: 7_000_000  # Pa — SINGLE shared source; threaded to
                                          # any component declaring this field
                                          # (surface, pump-bearing production wells)
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check | auto-pressure | auto-flow | auto-both
  mass_rate: 50              # kg/s
  bc_checkpoint_idx: 4       # component_idx of the surface (below)

economic:
  # Computed by DoubletEconomicComponent (src/tango/components/economic/doublet.py)
  # once per run, after all timesteps complete — see SystemDirect.finalize().
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095

components:

  surface:
    type: surface
    variant: graph
    component_idx: 4          # solved last (surface consumes production well output)
    prev: 3
    next: 0
    injection_pressure: 2_000_000   # Pa — initial guess for bc_iteration solver
    pipe_diameter: 0.41        # m
    approach_temperature: 7.0  # K
    pipe_roughness: 55.e-6     # m — absolute pipe wall roughness
    # well_spacing is NOT set here — it's sourced from layout.well_spacing
    # above (see _PROTECTED_COMPONENT_KEYS in workflows/workflow.py for the
    # duplicated-value bug class this guards against).

    power_plant:
      # Double-flash TESPy topology: two flash stages (higher-pressure
      # droplet_separator1, lower-pressure droplet_separator2), each with
      # its own turbine, condensate from both recombined via merge1 and
      # pumped back through two stages (pump1 for the second flash's
      # residual liquid, pump2 for the combined condensate) via merge2.
      #
      # Source("inlet") -> valve1 -> droplet_separator1 -(vapor)-> turbine1 -> condenser1 -\
      #                                                \-(liquid)-> valve2 -> droplet_separator2 -(vapor)-> turbine2 -> condenser2 -\
      #                                                                                    \-(liquid)-> pump1 -----------------------\
      #                                                                                                                    merge1(condenser1, condenser2) -> pump2 -\
      #                                                                                                                                            merge2(pump1, pump2) -> Sink("outlet")
      nodes:
        inlet:
          type: Source

        valve1:
          type: Valve
          p_out_megapascals: 0.1    # MPa (= 1 bar)

        droplet_separator1:
          type: DropletSeparator

        turbine1:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.005          # MPa (= 0.05 bar)

        condenser1:
          type: SimpleHeatExchanger
          p_out_megapascals: 0.005          # MPa (= 0.05 bar)
          vapor_mass_fraction_out: 0          # dimensionless [0-1] — TESPy vapor quality x (0 = saturated liquid, 1 = saturated vapor)
          # Cost-only metadata (DoubletEconomicComponent, ignored by GraphSurface's
          # physics): a singleton set (no paired cooler), closed/wet cooling tower.
          Subtype: condenser
          set_number: 1
          design: closed
          cooling_tower_mode: WET

        valve2:
          type: Valve
          p_out_megapascals: 0.05    # MPa (= 0.5 bar)

        droplet_separator2:
          type: DropletSeparator

        turbine2:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.005          # MPa (= 0.05 bar)

        condenser2:
          type: SimpleHeatExchanger
          # No p_out here — its outlet pressure is pinned by merge1's
          # equal-pressure constraint across its inlets to match condenser1's
          # 0.005 MPa, not an independently-declared value.
          vapor_mass_fraction_out: 0          # dimensionless [0-1] — TESPy vapor quality x (0 = saturated liquid, 1 = saturated vapor)
          # Cost-only metadata — see condenser1's comment above.
          Subtype: condenser
          set_number: 2
          design: closed
          cooling_tower_mode: WET

        pump1:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        pump2:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        merge1:
          type: Merge

        merge2:
          type: Merge

        outlet:
          type: Sink

      edges:
        '1': {source: inlet, target: valve1}
        '2': {source: valve1, target: droplet_separator1}
        '3': {source: droplet_separator1, target: turbine1, source_port: out2}    # vapor branch (1st flash)
        '4': {source: droplet_separator1, target: valve2, source_port: out1}      # liquid branch (1st flash) -> 2nd flash
        '5': {source: valve2, target: droplet_separator2}
        '6': {source: droplet_separator2, target: turbine2, source_port: out2}    # vapor branch (2nd flash)
        '7': {source: droplet_separator2, target: pump1, source_port: out1}       # liquid branch (2nd flash) -> pumped back
        '8': {source: turbine1, target: condenser1}
        '9': {source: turbine2, target: condenser2}
        '10': {source: condenser1, target: merge1, target_port: in1}
        '11': {source: condenser2, target: merge1, target_port: in2}
        '12': {source: merge1, target: pump2}
        '13': {source: pump1, target: merge2, target_port: in1}
        '14': {source: pump2, target: merge2, target_port: in2}
        '15': {source: merge2, target: outlet}

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0
    prev: 4
    next: 1
    well_length: 5000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 5000.0       # m
    thickness: 300.0              # m
    permeability: 5.0e-14         # m2 (~50 mD)
    porosity: 0.1
    hydro_static_pressure: 50_000_000  # Pa
    over_pressure_percentage: 10
    well_eff_diameter: 0.410      # m — average of injection/production well diameters (both 0.410)

  production_well_lower:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    well_length: 4000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    wellhead_depth: 1000.0    # m — matches production_well_upper's well_length below

  production_well_upper:
    type: production_well_with_pump
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 1000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    pump_efficiency: 0.55          # overall ESP string efficiency, van 't Spijker & Ungemach (2016) -- see docs/SOURCES.md#vantspijker2016
    # target_extraction_pressure is NOT set here — it's sourced from
    # sim_config.target_extraction_pressure below (see that field's
    # docstring in core/specs.py for the duplicated-value bug this fixed).
