# tango format — CO2 Plume Geothermal (CPG), direct-heat (district heating)
# extraction.
#
# Same doublet subsurface as CPG_electric.yml (injection_well -> reservoir
# -> production_well_lower -> production_well_upper -> surface -> back to
# injection_well), same CO2 fluid, same depth/mass_rate/target_extraction_pressure
# -- copied verbatim, see that file's header comment for the full subsurface
# rationale (why CO2 stays supercritical/dense-phase through the subsurface,
# depth/injection-pressure provenance from old tango's CPG_num_pp.yml).
#
# The surface plant differs, and is actually SIMPLER than CPG_electric.yml's:
# no turbine, no phase-change/condensing-pressure reasoning needed at all.
# A district-heating exchanger (dh_hx) at a realistic DH return temperature
# (50 degC / 323.15 K) is comfortably ABOVE CO2's ~31 degC (304.13 K)
# critical temperature, so the fluid NEVER crosses into the two-phase dome
# (T > Tc rules that out at any pressure) -- unlike CPG_electric.yml, which
# deliberately drives CO2 down into the two-phase dome (condensing liquid)
# before reinjection.
#
# CORRECTION (Chad, 2026-09-25): an earlier draft of this file claimed the
# fluid stays "supercritical dense-phase" through the surface plant too --
# checked by direct run and that's not accurate. This config uses a plain
# production_well (no pump), same as CPG_electric.yml, so
# target_extraction_pressure below has NO effect on the production side
# (it's only threaded to the surface component and pump-bearing production
# wells -- see its own docstring in core/specs.py) -- the production
# wellhead's real pressure is whatever the reservoir/well physics naturally
# deliver, confirmed by direct run to be ~5.6-5.9 MPa, BELOW CO2's 7.38 MPa
# critical pressure. Since temperature stays comfortably above the ~31 degC
# critical temperature throughout (T > Tc alone guarantees single-phase, no
# two-phase dome to cross regardless of P), this is still a perfectly valid,
# crash-free single-phase gas state -- just not "supercritical dense-phase"
# in the strict thermodynamic sense the earlier draft claimed. dh_hx's own
# fixed outlet pressure (below) is chosen with this real, lower natural
# pressure in mind, not the higher value an earlier (buggy) draft assumed --
# see that node's own comment for what went wrong and how it was caught.
#
# SUPERSEDED FINDING, kept here as a record (2026-09-25): an earlier draft
# with the unphysical dh_hx pressure bug above ALSO showed production
# temperature declining with reservoir depletion (328 K at t=0 toward
# 320 K by t=10) and, past ~year 9, dropping below the 50 degC return
# target -- which motivated shortening num_tsteps to 8 and a real
# side-investigation into a near-critical-point CoolProp crash when trying
# to lower the target instead. Once dh_hx's pressure bug was fixed,
# production temperature no longer declines at all -- it stabilizes at
# ~331.6 K almost immediately and stays there the full 20 years (confirmed
# by direct run), comfortably above both the 50 degC target and CO2's
# critical point throughout. The unphysical "free" pressure rise was
# evidently perturbing the reinjection-side energy balance enough to drive
# artificial depletion and instability that isn't real physics --
# num_tsteps is back to CPG_electric.yml's own 20, not shortened.

title: CO2 Plume Geothermal (CPG), doublet, direct-heat extraction

description:
  summary: CPG doublet with supercritical-CO2 direct-heat extraction (companion to CPG_electric.yml)
  date: "2026-09-25"
  description: >
    Single-doublet CO2 Plume Geothermal system, same subsurface as
    CPG_electric.yml, with a district-heating heat exchanger instead of a
    turbine/condenser power plant -- CO2 stays single-phase (above its
    critical temperature) through the entire loop, never crossing into
    the two-phase dome.

common:
  fluid_name: CO2
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m
  surface_temperature: 288   # K — ambient
  surface_pressure: 100_000  # Pa — ambient

layout:
  well_spacing: 707.0        # m

sim_config:
  num_tsteps: 20
  dt_years: 1.0                # years
  target_extraction_pressure: 8_000_000  # Pa — INERT for this topology: only
                                          # threaded to the surface component
                                          # and pump-bearing production wells,
                                          # and this config's production_well_upper
                                          # is plain (no pump) -- see header
                                          # comment's 2026-09-25 correction.
                                          # Kept at CPG_electric.yml's own value
                                          # for consistency, not because it does
                                          # anything here.
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check | auto-pressure | auto-flow | auto-both
  mass_rate: 200                # kg/s — matches CPG_electric.yml's subsurface loop
  bc_checkpoint_idx: 4           # component_idx of the surface (below)

economic:
  # Same CAPEX-coverage caveat as AGS_direct_heat.yml/hydro_direct_heat.yml:
  # the district-heating exchanger has no Subtype: cooler/condenser tag, so
  # CAPEX_surface_plant is 0.0 here (real, not a crash) until a
  # direct-heat-exchanger cost formula is ported.
  type: doublet
  project_maturity: brown_field  # matches CPG_electric.yml/old tango's CPG_num_pp.yml
  discount_rate: 0.095
  main_product: heat

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0          # first component solved each pass — circuit cut here
    prev: 4
    next: 1
    well_length: 2500.0       # m — reservoir depth; matches CPG_electric.yml exactly
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 2500.0       # m — matches CPG_electric.yml exactly
    thickness: 300.0              # m
    permeability: 5.0e-14         # m2 (~50 mD)
    porosity: 0.1
    hydro_static_pressure: 25_000_000  # Pa — nominal, used only for the fracking-safety ceiling
    over_pressure_percentage: 20
    brine_density: 1000            # kg/m3 — used for the reservoir's own
                                    # initial/undepleted pressure, not the
                                    # circulating fluid (see brine_density's
                                    # own docstring in core/specs.py)
    well_eff_diameter: 0.410      # m — average of injection (0.410) and production (0.410) well diameters

  production_well_lower:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    well_length: 2000.0       # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    wellhead_depth: 500.0     # m — matches production_well_upper's well_length below

  production_well_upper:
    type: production_well
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 500.0        # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    # target_extraction_pressure is NOT set here — it's sourced from
    # sim_config.target_extraction_pressure above.

  surface:
    type: surface
    variant: graph
    component_idx: 4          # solved last (surface consumes production well output)
    prev: 3
    next: 0
    injection_pressure: 7_500_000   # Pa — chosen ABOVE CO2's 7.38 MPa critical
                                     # pressure (unlike CPG_electric.yml's
                                     # 7_131_030 Pa condensed-liquid case), keeping
                                     # this reinjection point single-phase --
                                     # though see header comment's 2026-09-25
                                     # correction: the fluid earlier in the surface
                                     # loop (at dh_hx) is actually sub-critical
                                     # pressure, just still single-phase gas since
                                     # T stays above Tc throughout. circulation_control
                                     # (below) does the real work of getting from
                                     # that lower natural pressure up to this value.
    pipe_diameter: 0.41        # m
    approach_temperature: 7.0  # K
    pipe_roughness: 55.e-6     # m — absolute pipe wall roughness

    power_plant:
      # Direct-heat surface plant: identical shape to
      # AGS_direct_heat.yml's/hydro_direct_heat.yml's power_plant -- see
      # those files' comments for the full node-by-node rationale. No
      # phase-change reasoning needed here at all: 50 degC (323.15 K) is
      # comfortably above CO2's ~31 degC critical temperature, so dh_hx's
      # T_out keeps the fluid single-phase (T > Tc rules out the two-phase
      # dome regardless of pressure -- see header comment's 2026-09-25
      # correction for why this isn't the same as "supercritical").
      nodes:
        inlet:
          type: Source
        dh_hx:
          type: SimpleHeatExchanger
          role: net_thermal
          T_out: 323.15    # K (50 degC) — district-heating return / re-injection temperature
          p_out_megapascals: 5.0  # MPa -- ABSOLUTE value (unlike AGS_direct_heat.yml's
                                     # pressure_ratio: 0.99). A fixed absolute value sidesteps
                                     # CO2's TESPy-initial-guess problem: TESPy's own blind default
                                     # guess for a new connection isn't a valid CO2 state at all
                                     # near ambient pressure (below CO2's ~5.18 bar triple-point
                                     # pressure) -- confirmed by direct run: a plain pressure_ratio
                                     # here (matching AGS_direct_heat.yml's pattern) fails outright
                                     # with a CoolProp out-of-range error before the solver ever
                                     # reaches a real answer.
                                     #
                                     # CORRECTION (Chad, 2026-09-25): an earlier draft set this to
                                     # 7.92 MPa (derived from target_extraction_pressure * 0.99,
                                     # mirroring the wrong assumption that this node's own inlet
                                     # would naturally be near 8 MPa). That was WRONG and, worse,
                                     # unphysical: dh_hx's real solved inlet pressure here is only
                                     # ~5.6-5.9 MPa (confirmed by direct run) -- well BELOW 7.92
                                     # MPa. A fixed absolute p_out ABOVE a passive component's own
                                     # inlet silently asks it to raise pressure with no work input,
                                     # something no real heat exchanger can do -- TESPy accepted
                                     # this numerically anyway (no validity check exists for
                                     # SimpleHeatExchanger the way _check_pump_or_valve_validity
                                     # exists for PumpOrValve), so this was a real, silent bug, not
                                     # a design choice. 5.0 MPa is comfortably below the minimum
                                     # natural inlet pressure observed across the whole run.
        circulation_control:
          type: PumpOrValve
          role: net_electric
          efficiency: 0.90    # dimensionless [0-1] — TESPy eta_s (isentropic efficiency);
                                # matches CPG_electric.yml's pump node default. Resolves to a
                                # real, running Compressor across the whole run (confirmed by
                                # direct run) -- genuine physics, not an artifact: dh_hx's real
                                # ~5.0 MPa outlet (see its own comment) is well below
                                # injection_pressure's 7.5 MPa target, so an actual pump is
                                # needed to bridge that gap. Contrast CO2_EGS_direct_heat.yml's
                                # own circulation_control, which resolves to a passive Valve
                                # instead -- that design's natural pressure genuinely exceeds
                                # its own injection_pressure, this one's doesn't.
          p0_out1: 75          # bar (= 7.5 MPa, matches injection_pressure above) — TESPy guess
                                # value; NOTE unlike p_out_megapascals, p0_out{N}/h0_out{N} pass
                                # their raw value straight through in TESPy's own network unit
                                # (bar), no MPa->bar conversion (see graph.py's
                                # _apply_connection_config docstring). Must use the {N}-suffixed
                                # form even for a single-port node -- a bare p0_out never matches
                                # any connection's source_id ("out1"), so it's silently a no-op.
        outlet:
          type: Sink
      edges:
        '1': {source: inlet, target: dh_hx}
        '2': {source: dh_hx, target: circulation_control}
        '3': {source: circulation_control, target: outlet}
