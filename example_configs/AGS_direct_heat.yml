# tango format — Advanced Geothermal System (AGS), direct-heat only.
#
# Ported from applications/run_AGS_direct_heat_sweep/triemli_dh_base.yml (the
# Triemli, Zurich site). AGS is a sealed closed-loop wellbore — there is no
# reservoir component: injection_well -> horizontal_well -> production_well
# -> surface -> back to injection_well. All heat exchange is conductive,
# through the wellbore walls (Zhang et al. 2011 model, same as the vertical
# wells), not via reservoir permeability.
#
# horizontal_well uses the base NumericalWell class directly (registered as
# horizontal_well/numerical) rather than the NumericalInjectionWell /
# NumericalProductionWell subclasses, with angle_from_vert_deg: 90 (fully
# horizontal) — see components/well/numerical.py module docstring for how a
# single marching scheme now covers vertical, horizontal, and deviated wells.
#
# No reservoir means InjectionPolicy's fracking-threshold machinery is
# irrelevant here, but the closed loop still needs SystemBCIteration (not
# SystemDirect): only SystemBCIteration seeds the circuit's first inlet
# (injection_well) with cold conditions on timestep 0 via
# _seed_circuit_inlet(). injection_mode: manual selects it and runs a single
# circuit pass per timestep (no reservoir means _converge_injection_enthalpy() is a
# no-op — see its "if reservoir is None: return" guard).
#
# Site parameters (Triemli, Zurich):
#   surface temperature : 11 degC (284.15 K)
#   thermal gradient     : 35 degC/km (0.035 K/m)
#   fluid                : H2O
#   application          : direct heat only (district heating, no electricity)
#   DH return temp       : 50 degC (re-injection temperature)
#
# Depth/loop-length values below are one point from the original sweep's
# range (well_depth 2000-6500 m, loop_length 707-2500 m) — 707 m is the
# range's validated reference point (see triemli_dh_base.yml's assumption
# note), used here as-is rather than swept.

title: Advanced Geothermal System (AGS), direct-heat, Triemli site

common:
  fluid_name: H2O
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  well_spacing: 707.0        # m — horizontal loop length; used by the surface
                              # component as the injector-to-producer surface
                              # pipe run.

sim_config:
  num_tsteps: 25              # 25 years of operation
  dt_years: 1.0                # years
  target_extraction_pressure: 7_000_000  # Pa — SINGLE shared source; threaded to
                                          # any component declaring this field
                                          # (surface, pump-bearing production wells)
  injection_mode: manual       # see module docstring: required even without a reservoir
  mass_rate: 30                 # kg/s -- at this value, circulation_control's (see power_plant.nodes
                                  # below) natural driving pressure falls slightly short of
                                  # injection_pressure at some point over the 25-year run, so this
                                  # baseline exercises circulation_control's Compressor leg
                                  # (type: PumpOrValve resolves each solve() to whichever of Valve/
                                  # Compressor is physically valid), giving this file's own default
                                  # run live coverage of both resolution paths, not just one.
  bc_checkpoint_idx: 3           # component_idx of the surface (below)

economic:
  # Computed by DoubletEconomicComponent, but scoped/verified against the
  # DOUBLET + turbine/pump/condenser topology (hydro_df_electric.yml), not
  # this one — confirmed CAPEX_surface_plant comes back 0.0 here (not a
  # crash): the district-heating exchanger has no Subtype: cooler/condenser
  # tag, so it isn't counted by any of the ported surface-plant cost
  # formulas. CAPEX_total/LCOH below are real but understate true cost
  # (missing the surface heat exchanger's own equipment cost) until a
  # direct-heat-exchanger cost formula is ported. See
  # DoubletEconomicComponent's module docstring for the full scope.
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: heat

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0           # circuit entry — where the solve pass begins each timestep
    prev: 3
    next: 1
    well_length: 3000.0        # m — vertical well depth
    diameter: 0.311             # m  (~12-inch casing)
    pipe_roughness: 5.5e-5      # m

  horizontal_well:
    type: horizontal_well
    variant: numerical
    component_idx: 1
    prev: 0
    next: 2
    well_length: 707.0          # m — horizontal loop flow-path length
    diameter: 0.311              # m
    pipe_roughness: 5.5e-5       # m
    wellhead_depth: 3000.0       # m — starting (vertical) depth, matches injection_well's well_length
    angle_from_vert_deg: 90       # fully horizontal — see components/well/numerical.py

  production_well:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    well_length: 3000.0         # m — vertical well depth
    diameter: 0.311              # m
    pipe_roughness: 5.5e-5       # m

  surface:
    type: surface
    variant: graph
    component_idx: 3            # solved last, loops back to injection_well (next: 0)
    prev: 2
    next: 0
    injection_pressure: 1_500_000  # Pa — fixed value under injection_mode: manual (see
                                     # sim_config above); kept below the production
                                     # wellhead pressure so TESPy's pr<=1 constraint on
                                     # dh_hx isn't violated. AUTO_PRESSURE mode exists and
                                     # does converge this value iteratively -- see
                                     # SystemBCIteration's module docstring -- this config
                                     # just chooses manual instead.
    pipe_diameter: 0.41               # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m
    # well_spacing is NOT set here — it's sourced from layout.well_spacing
    # above (see _PROTECTED_COMPONENT_KEYS in workflows/workflow.py for the
    # duplicated-value bug class this guards against).

    power_plant:
      # Direct-heat surface plant: produced fluid passes through a
      # district-heating heat exchanger, then circulation_control brings it
      # back up to injection_pressure before it re-enters the ground — no
      # turbine, no by-product electricity generation, but real electricity
      # CAN be consumed here (see circulation_control below).
      #
      # circulation_control exists because something has to set the
      # pressure driving circulation around this closed loop, and it isn't
      # necessarily free: neither well (injection_well/production_well,
      # both plain non-pump types) provides one, so the loop runs on
      # thermosiphon effect (the density difference between the cold
      # descending injection leg and hot ascending production leg) plus
      # friction. Without an explicit device here, a design's natural
      # driving pressure can end up arbitrarily close to the fluid's own
      # saturation pressure at the delivered temperature -- not a safe
      # operating margin a real system would accept. See TANGO
      # Commandments (CONTRIBUTING.md) for the rule this enforces, and
      # `workflows/workflow.py::_check_loop_has_pressure_source`, which
      # requires a device like this one on any closed loop.
      #
      # type: PumpOrValve, not a plain Valve or Compressor: the
      # thermosiphon effect plus friction losses can either exceed or
      # fall short of what a given design's injection_pressure target
      # needs, depending on depth/loop geometry/mass flow -- a passive
      # throttle valve is correct when there's a natural surplus (a
      # Compressor there would solve to impossible negative power), while
      # a real pump is correct when there's a shortfall (a Valve there
      # would need to raise pressure, impossible for a passive device).
      # Since which regime applies varies by design point, GraphSurface
      # builds both a Valve- and a Compressor-resolved network for this
      # node and picks whichever is physically valid each solve() -- see
      # GraphSurface's own module docstring, `_NetworkBundle`, and
      # `docs/bugs-fixed-in-tango.md`'s "AGS closed loop has no pump
      # anywhere" entry.
      #
      # No p_out_megapascals here, deliberately: injection_pressure
      # (below) already hard-sets the pressure on the outlet connection
      # this node feeds into (see GraphSurface.set_injection_pressure).
      # Also specifying a pressure target on circulation_control itself
      # would be a second, independent equation pinning the SAME
      # connection — an over-determined system, not a more-constrained
      # one. Mirrors hydro_df_electric.yml's pump1/pump2, which have no
      # p_out of their own for the identical reason.
      nodes:
        inlet:
          type: Source
        dh_hx:
          type: SimpleHeatExchanger
          role: net_thermal
          T_out: 323.15    # K (50 degC) — district-heating return / re-injection temperature
          pressure_ratio: 0.99   # dimensionless — small, realistic conductive-HX loss (~1%).
                                   # A RATIO, not an absolute p_out: dh_hx's actual inlet pressure
                                   # varies by design point (whatever the well naturally delivers,
                                   # from ~tens of kPa to tens of MPa across the swept range — see
                                   # circulation_control comment above), so a fixed absolute p_out
                                   # would be wrong (or physically impossible, > inlet) for most of
                                   # that range. dh_hx is not the last node before the network's
                                   # outlet Sink -- injection_pressure's boundary condition sits on
                                   # circulation_control's outlet instead (see below) -- so dh_hx
                                   # needs its own pressure-drop spec to keep the network fully
                                   # determined.
        circulation_control:
          type: PumpOrValve
          role: net_electric
          efficiency: 1.0    # dimensionless [0-1] — TESPy eta_s (isentropic efficiency), used only
                              # by this node's Compressor-resolved leg (a no-op for the Valve-
                              # resolved leg, which has no eta_s attribute -- see
                              # GraphSurface._apply_node_config). Matches hydro_df_electric.yml's
                              # pump1/pump2 default; revisit if a more realistic circulation-pump
                              # efficiency is needed.
        outlet:
          type: Sink
      edges:
        '1': {source: inlet, target: dh_hx}
        '2': {source: dh_hx, target: circulation_control}
        '3': {source: circulation_control, target: outlet}
