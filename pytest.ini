[pytest]
testpaths        = tests
python_files     = test_*.py
addopts          = -v --tb=short
markers          =
    perf: wall-clock timing assertions; unreliable under CPU contention (e.g. `pytest -n auto`) — deselect with `-m "not perf"` in parallel runs
    slow: full-length (real N_TSTEPS) numeric parity/reference checks; a faster companion covering the same code path at a reduced timestep count runs by default instead — deselect with `-m "not slow"`, run explicitly with `-m slow` before merging changes that could affect long-run numerics.
filterwarnings   =
    ignore:`np.math` is a deprecated alias:DeprecationWarning
    ignore:The ``feasible`` property for ``pymoo.core.individual.Individual`` is deprecated:DeprecationWarning
log_level        = WARNING
log_cli_level    = WARNING
