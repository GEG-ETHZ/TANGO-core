[pytest]
testpaths        = tests
python_files     = test_*.py
markers          =
    perf: wall-clock timing assertions; unreliable under CPU contention (e.g. `pytest -n auto`) — deselect with `-m "not perf"` in parallel runs
    old_tango: exercises ONLY src/tango/ (old tango), no tango_next involvement — safe to deselect by default while old tango isn't being changed; run explicitly with `-m old_tango` if that changes. Does NOT cover old-vs-new parity tests, which use old tango as a reference oracle for tango_next and stay in the default run.
filterwarnings   =
    ignore:`np.math` is a deprecated alias:DeprecationWarning
    ignore:The ``feasible`` property for ``pymoo.core.individual.Individual`` is deprecated:DeprecationWarning
log_level        = WARNING
log_cli_level    = WARNING
