# Copyright and license for every file that doesn't carry its own SPDX header.
# Python files carry the header themselves and are deliberately not listed,
# so `reuse lint` (a prek hook) fails on a Python file without one. A new
# file type fails it too, until its pattern is added here.
version = 1

[[annotations]]
path = [
    "**.md", "**.yml", "**.yaml", "**.drawio", "**.svg", "**.sh",
    "**.lock", "**.toml", "**.png", "**.json", "**.jpg", "**.txt",
    "**.typed", "**.msh", "**.ini", "**.hash", "**.geo", "**.csv",
    "**.css", "**.cff", "**.gitignore", "**.ignore", "**.envrc", "**.editorconfig",
    "**.dvcignore", "**.zprofile", "justfile", ".dvc/config",
]
SPDX-FileCopyrightText = "2025 ETH Zurich"
SPDX-License-Identifier = "Apache-2.0"
