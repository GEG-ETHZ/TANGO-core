# Docs site: build on every pull request (a broken page fails the check),
# build and deploy to GitHub Pages on every push to main, and on demand
# (Actions → Docs site → Run workflow).
#
# The deployed site is the public build (mkdocs.yml, `site/`). The internal
# build (mkdocs.internal.yml) adds the task log, roadmap and archive; it is
# built here only so a broken internal page fails the check, and is never
# deployed.
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # never cancel a Pages deploy halfway; superseded pull request builds may go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --only-group docs --no-install-project
      - name: Build the public site (deployed)
        run: uv run --no-sync zensical build --clean
      - name: Build the internal site (check only)
        run: uv run --no-sync zensical build --clean -f mkdocs.internal.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
