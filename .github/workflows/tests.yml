# Lint, type-check, the generated-docs check, and unit tests on every PR and
# on pushes to main/develop, with unit tests on macOS, Linux, and Windows.
# tests/regtest/ isn't run here: it takes over an hour (see tests/README.md);
# the pre-push hook runs its fast subset, and `just test --all` runs
# everything before a release tag is pushed.
name: tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - name: Generated reference pages are up to date
        run: uv run python tools/gen_reference.py --check

  test:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish, so a platform-specific failure isn't hidden by
      # another platform's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # src/tango.hash must come out identical on every platform (it drives
      # DVC's staleness checks); a mismatch means hash_tango.py differs by OS.
      - name: src/tango.hash is current
        run: uv run python tools/hash_tango.py
      - run: uv run pytest tests/unit -v
