# Lint, type-check, the generated-docs check, and tests on every PR and on
# pushes to main/develop, with tests on macOS, Linux, and Windows. The tests
# are the pre-push hook's selection (unit and regression, without `slow` and
# `perf`), so CI checks what every push was meant to have passed; `just test
# --all` runs everything before a release tag is pushed (see tests/README.md).
name: tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - name: Generated reference pages are up to date
        run: uv run python tools/gen_reference.py --check

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish, so a platform-specific failure isn't hidden by
      # another platform's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # src/tango_core.hash must come out identical on every platform (it drives
      # DVC's staleness checks); a mismatch means hash_tango.py differs by OS.
      - name: src/tango_core.hash is current
        run: uv run python tools/hash_tango.py
      # -X warn_default_encoding: fail on a text file opened without an
      # encoding (see pytest.ini), which breaks on Windows.
      - run: uv run python -X warn_default_encoding -m pytest -m "not slow and not perf" tests/ -v

  newer-python:
    # Development runs on Python 3.11 with uv.lock (the jobs above), but
    # requires-python also allows 3.12 and 3.13. Install tango-core the way a
    # PyPI user does, resolving the newest allowed dependencies rather than
    # the lock, so a dependency release that breaks it shows up here first.
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install . pytest pytest-xdist
      - run: .venv/bin/python -X warn_default_encoding -m pytest -m "not slow and not perf" tests/ -v

  raft:
    # The optional RAFT group (grouped_subsurface variant `raft`). GEG-ETHZ/RAFT is
    # private until its public release, so installing it needs the read-only
    # deploy key in the RAFT_DEPLOY_KEY secret; uv.lock keeps the HTTPS URL
    # and the insteadOf rewrite routes the fetch over SSH. Every step is
    # skipped while the secret is absent (e.g. PRs from forks). Drop the key
    # and the rewrite once RAFT is public. Besides the test job's selection
    # (whose RAFT tests use a stand-in for RAFT), one simulated year runs on
    # the real RAFT, using the example's mesh committed in templates/raft/,
    # so a change in RAFT's coupling API fails here.
    name: tests with RAFT (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      RAFT_DEPLOY_KEY: ${{ secrets.RAFT_DEPLOY_KEY }}
    steps:
      - if: env.RAFT_DEPLOY_KEY == ''
        run: echo "::notice::RAFT_DEPLOY_KEY is not set; skipping the RAFT job."
      - if: env.RAFT_DEPLOY_KEY != ''
        uses: actions/checkout@v5
      - if: env.RAFT_DEPLOY_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RAFT_DEPLOY_KEY }}
      - if: env.RAFT_DEPLOY_KEY != ''
        run: git config --global url."ssh://git@github.com/GEG-ETHZ/RAFT".insteadOf "https://github.com/GEG-ETHZ/RAFT"
      - if: env.RAFT_DEPLOY_KEY != ''
        uses: astral-sh/setup-uv@v7
      - if: env.RAFT_DEPLOY_KEY != ''
        run: uv sync --locked --group raft
      - if: env.RAFT_DEPLOY_KEY != ''
        run: uv run python -X warn_default_encoding -m pytest -m "not slow and not perf" tests/ -v
      - if: env.RAFT_DEPLOY_KEY != ''
        run: uv run python -X warn_default_encoding -m pytest tests/regtest/test_raft_integration.py -v
