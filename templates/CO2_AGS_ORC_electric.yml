# Design point: opt_CO2_AGS_ORC_electric's Pareto pick (the design closest to the ideal corner),
# design 23 of its outputs/pareto_results.csv (md5 2de65b9d3fe1a132ac80fa3345d82b30),
# recorded in dvc.lock at commit 894a47ed. Decision variables rounded to
# 3 significant figures.
#
# tango format — Advanced Geothermal System (AGS) with CO2 as the working
# fluid, binary (ORC) power extraction, hypothetical deepened variant of
# the Triemli site.
#
# NOT the real Triemli site: rock properties/gradient match the real site,
# but the well depths below are a hypothetical deepening. Nothing here
# should be read as a real drilling proposal for Triemli.
#
# Same closed-loop subsurface SHAPE and CO2-specific design choices as
# CO2_AGS_direct_heat.yml (plain production_well, pressures kept clear of
# CO2's 7.38 MPa critical pressure) -- see that file's header comment for
# the full rationale, including the near-critical-point enthalpy failure
# mode it documents (real, not a bug, and a genuinely different problem
# from the near-critical solver CRASH found in CPG_direct_heat.yml).
#
# Depth is deepened for a THIRD, different reason from either of the other
# two depth-driven fixes in this coverage matrix (AGS_ORC_electric.yml
# needed more temperature for its ORC cycle; CO2_AGS_direct_heat.yml needed
# to escape CO2's near-critical region). Here both apply at once: a 6000 m
# loop clears the near-critical region but only delivered ~64 degC in a
# direct run -- not enough for the generic ORC design used in this matrix
# (AGS_ORC_electric.yml, CO2_EGS_ORC_electric.yml). This file uses
# 10,000 m (the opt_CO2_AGS_ORC_electric Pareto pick; see the Design point
# header). Not claimed as a realistic drilling target for the real Triemli
# site -- illustrative only, same spirit as AGS_ORC_electric.yml's own
# disclaimer.
#
# The surface plant: same binary (ORC) topology as AGS_ORC_electric.yml's/
# CO2_EGS_ORC_electric.yml's power_plant -- see those files for the full
# node-by-node rationale. preheater's own CO2-side (out1) outlet
# pressure is an ABSOLUTE p_out_megapascals (not a pressure_ratio1), for
# the same CO2-TESPy-initial-guess reason as every other CO2 config in this
# matrix. This value (11.0 MPa) is set by the opt_CO2_AGS_ORC_electric
# Pareto pick and must not exceed the closed loop's own natural pressure
# at that point -- see CPG_direct_heat.yml's unphysical-pressure-rise bug,
# and CO2_AGS_direct_heat.yml's finding that a CLOSED LOOP's natural
# pressure is genuinely coupled to the surface plant's own downstream
# choices (not an independent quantity to check once and treat as fixed),
# so the margin has to hold across the whole run, not just at t=0.
#
# Site parameters (Triemli, Zurich) — rock properties/gradient identical to
# AGS_direct_heat.yml/CO2_AGS_direct_heat.yml, depth deepened further (see above):
#   surface temperature : 11 degC (284.15 K)
#   thermal gradient     : 35 degC/km (0.035 K/m)
#   fluid                : CO2
#   application          : binary (ORC) electricity generation

title: Advanced Geothermal System (AGS) with CO2, binary (ORC) power extraction, hypothetical deepened Triemli-like site

common:
  fluid_name: CO2
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  # well_spacing: derived: equals horizontal_well.well_length (the wellheads are a loop length apart) (see tango.workflows.linked_quantities)

sim_config:
  num_tsteps: 20              # years
  dt_years: 1.0                # years
  target_extraction_pressure: 8_000_000  # Pa — INERT for this topology (plain
                                          # production_well, no pump) -- kept
                                          # for consistency, matching every
                                          # other CO2 config.
  injection_mode: manual       # see AGS_direct_heat.yml's module docstring: required
                                # even without a reservoir
  mass_rate: 69.9               # kg/s — set by the opt_CO2_AGS_ORC_electric Pareto pick; see header
  bc_checkpoint_idx: 3           # component_idx of the surface (below)

economic:
  # Same CAPEX-coverage note as AGS_ORC_electric.yml: this surface plant's
  # turbine/pump/condenser-shaped nodes ARE tagged the same way
  # hydro_df_electric.yml's are, so CAPEX coverage should be reasonably
  # complete.
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: electricity

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0           # circuit entry — where the solve pass begins each timestep
    prev: 3
    next: 1
    well_length: 10_000         # m — vertical well depth (hypothetically deepened, see header comment)
    diameter: 0.464             # m  (~18-inch casing)
    pipe_roughness: 5.5e-5      # m

  horizontal_well:
    type: horizontal_well
    variant: numerical
    component_idx: 1
    prev: 0
    next: 2
    well_length: 8000           # m — horizontal loop flow-path length
    diameter: 0.75               # m
    pipe_roughness: 5.5e-5       # m
    # wellhead_depth: derived: equals injection_well.well_length (see tango.workflows.linked_quantities)
    angle_from_vert_deg: 90       # fully horizontal — see components/well/numerical.py

  production_well:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    # well_length: derived: equals injection_well.well_length (see tango.workflows.linked_quantities)
    diameter: 0.464              # m
    pipe_roughness: 5.5e-5       # m

  surface:
    type: surface
    variant: graph
    component_idx: 3            # solved last, loops back to injection_well (next: 0)
    prev: 2
    next: 0
    injection_pressure: 11_000_000   # Pa — well clear of CO2's 7.38 MPa critical pressure.
    pipe_diameter: 0.358              # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m

    power_plant:
      # Binary (ORC) TESPy topology, same shape as AGS_ORC_electric.yml's/
      # CO2_EGS_ORC_electric.yml's power_plant -- see those files for the full
      # node-by-node rationale.
      nodes:
        inlet:
          type: Source

        outlet:
          type: Sink

        evaporator:
          type: HeatExchanger
          ttd_l: 7                     # K — terminal temperature difference (boiler)
          pressure_ratio1: 1.0         # geofluid (CO2) side — dimensionless
          pressure_ratio2: 1.0         # secondary-fluid side — dimensionless
          h0_out1: 460                  # kJ/kg — TESPy guess value (real CoolProp-scale value
                                          # for CO2 near this design point, not borrowed from a
                                          # different fluid -- see CO2_EGS_ORC_electric.yml's own
                                          # correction for why this matters).
          p0_megapascals_out1: 9.5      # MPa — TESPy guess value
          p0_megapascals_out2: 0.649                # MPa (= 6.49 bar) — TESPy guess value (secondary-fluid outlet pressure)
          vapor_mass_fraction_out2: 1  # dimensionless [0-1] — secondary fluid leaves as saturated vapor

        preheater:
          type: HeatExchanger
          p_out_megapascals: 11.0      # MPa -- ABSOLUTE value on the CO2 (out1) side -- see
                                          # header comment for why it must stay below the closed
                                          # loop's own real, coupled natural pressure across the
                                          # whole run, not just at t=0.
          pressure_ratio2: 1.0         # secondary-fluid side — dimensionless
          vapor_mass_fraction_out2: 0  # dimensionless [0-1] — secondary fluid enters the boiler as saturated liquid
          p0_megapascals_out2: 0.649               # MPa (= 6.49 bar) — TESPy guess value (secondary-fluid outlet pressure)
          fluid_out2: R245fa           # secondary (ORC) working fluid — never mixes with the geofluid (common.fluid_name)

        circulation_control:
          type: PumpOrValve
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        orc_turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.125      # MPa (= 1.25 bar) -- condensing pressure, see orc_condenser

        orc_desuperheater:
          type: SimpleHeatExchanger
          p_out_megapascals: 0.125      # MPa (= 1.25 bar) -- condensing pressure, see orc_condenser
          vapor_mass_fraction_out: 1    # dimensionless [0-1] — TESPy vapor quality x

        orc_condenser:
          type: SimpleHeatExchanger
          # Condensing pressure, set by the site rather than chosen: R245fa
          # saturates at 20.4 degC at 1.25 bar, so the 1 K subcooled outlet
          # (19.4 degC) stays above the cooling limit of surface_temperature +
          # approach_temperature = 11 + 7 = 18 degC.
          p_out_megapascals: 0.125      # MPa (= 1.25 bar)
          subcooling_K: 1.0              # K below saturation: slightly subcooled condensate, so the pump never draws
                                         # exactly saturated liquid (TESPy left the condensate pump's equation
                                         # unconverged at x = 0) and has a margin against cavitation

        orc_feed_pump:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.649      # MPa (= 6.49 bar) — set by the opt_CO2_AGS_ORC_electric Pareto pick

        orc_cycle_closer:
          type: CycleCloser
          # No config -- purely topological, closes the secondary loop so
          # TESPy can solve it with no open Source/Sink of its own.

      edges:
        # Geofluid (CO2, primary) loop
        '1': {source: inlet, target: evaporator, target_port: in1}
        '2': {source: evaporator, source_port: out1, target: preheater, target_port: in1}
        '3': {source: preheater, source_port: out1, target: circulation_control}
        '4': {source: circulation_control, target: outlet}
        # Secondary (ORC working-fluid) loop
        '5': {source: orc_cycle_closer, target: preheater, target_port: in2}
        '6': {source: preheater, source_port: out2, target: evaporator, target_port: in2}
        '7': {source: evaporator, source_port: out2, target: orc_turbine}
        '8': {source: orc_turbine, target: orc_desuperheater}
        '9': {source: orc_desuperheater, target: orc_condenser}
        '10': {source: orc_condenser, target: orc_feed_pump}
        '11': {source: orc_feed_pump, target: orc_cycle_closer}
