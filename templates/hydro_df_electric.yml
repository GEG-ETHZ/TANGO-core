# Design point: opt_hydro_df_electric's Pareto pick (the design closest to the ideal corner),
# design 2 of its outputs/pareto_results.csv (md5 e759e71dc31cf4510935809b69edd00f),
# recorded in dvc.lock at commit 894a47ed. Decision variables rounded to
# 3 significant figures.
#
# tango format — conventional Hydrothermal system, double-flash electric
# power plant.
#
# Ported from old tango's flexible_DF_manual.yml (removed along with old
# tango; preserved at git tag pre-tango-core-rename-2026-09-18). The
# subsurface (doublet reservoir + pumped production) has the same topology
# as hydro_sf_electric.yml's —
# same site numbers, reused verbatim — only the surface plant differs: two
# flash stages (high_pressure_separator, then low_pressure_separator at a
# lower pressure, per standard double-flash design) each driving their
# own turbine, condensate from both recombined and pumped back to injection
# pressure through two pump stages.
#
# All eight node types below (Source/Sink/Valve/DropletSeparator/Turbine/
# SimpleHeatExchanger/Compressor/Merge) were already registered in
# GraphSurface's _COMPONENT_TYPES before this file was written — this
# topology needed zero new Python code, only YAML composition (see
# docs/TANGO_vision_and_roadmap/README.md's "Surface plant layouts are now
# configuration, not code" point).
#
# Two orphaned Sink nodes from the old-tango YAML (`turbine1_outlet`,
# `gas_flow_sink`) were dropped here — they were declared but never
# referenced by any edge in the original file, so they were dead
# declarations, not part of the actual executed topology.

title: Hydrothermal system with double-flash electric power plant, manual flow rate

common:
  fluid_name: H2O
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m
  surface_temperature: 288   # K — ambient
  surface_pressure: 100_000  # Pa — ambient

layout:
  well_spacing: 707.0        # m
  well_pattern: DOUBLET
  well_pattern_dimens: [1, 1]

sim_config:
  num_tsteps: 20
  dt_years: 1.0              # years
  target_extraction_pressure: 1_300_000    # Pa — SINGLE shared source; threaded to
                                          # any component declaring this field
                                          # (surface, pump-bearing production wells)
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check
  mass_rate: 150.0           # kg/s
  bc_checkpoint_idx: 4       # component_idx of the surface (below)

economic:
  # Computed by DoubletEconomicComponent (src/tango/components/economic/doublet.py)
  # once per run, after all timesteps complete — see SystemDirect.finalize().
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095

components:

  surface:
    type: surface
    variant: graph
    component_idx: 4          # solved last (surface consumes production well output)
    prev: 3
    next: 0
    injection_pressure: 3_190_000     # Pa — initial guess for bc_iteration solver
    pipe_diameter: 0.2         # m
    approach_temperature: 7.0  # K
    pipe_roughness: 55.e-6     # m — absolute pipe wall roughness
    # well_spacing is NOT set here — it's sourced from layout.well_spacing
    # above (see _PROTECTED_COMPONENT_KEYS in workflows/workflow.py for the
    # duplicated-value bug class this guards against).

    power_plant:
      # Double-flash TESPy topology: two flash stages
      # (high_pressure_separator, then low_pressure_separator), each with
      # its own turbine, condensate from both recombined via condensate_mixer and
      # pumped back through two stages (brine_pump for the second flash's
      # residual liquid, condensate_pump for the combined condensate) via reinjection_mixer.
      #
      # Source("inlet") -> high_pressure_flash_valve -> high_pressure_separator -(vapor)-> high_pressure_turbine -> high_pressure_condenser -\
      #                                                \-(liquid)-> low_pressure_flash_valve -> low_pressure_separator -(vapor)-> low_pressure_turbine -> low_pressure_condenser -\
      #                                                                                    \-(liquid)-> brine_pump -----------------------\
      #                                                                                                                    condensate_mixer(high_pressure_condenser, low_pressure_condenser) -> condensate_pump -\
      #                                                                                                                                            reinjection_mixer(brine_pump, condensate_pump) -> Sink("outlet")
      nodes:
        inlet:
          type: Source

        high_pressure_flash_valve:
          type: Valve
          p_out_megapascals: 0.204  # MPa (= 2.04 bar)

        high_pressure_separator:
          type: DropletSeparator

        high_pressure_turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.005          # MPa (= 0.05 bar)

        high_pressure_condenser:
          type: SimpleHeatExchanger
          p_out_megapascals: 0.005          # MPa (= 0.05 bar)
          subcooling_K: 1.0              # K below saturation: slightly subcooled condensate, so the pump never draws
                                         # exactly saturated liquid (TESPy left the condensate pump's equation
                                         # unconverged at x = 0) and has a margin against cavitation
          p0_megapascals_out1: 0.005                  # MPa -- TESPy starting guess; with no guess the
                                         # subcooled-outlet spec diverged in year 0
          h0_out1: 135                   # kJ/kg -- TESPy starting guess
          # Cost-only metadata (DoubletEconomicComponent, ignored by GraphSurface's
          # physics): a singleton set (no paired cooler), closed/wet cooling tower.
          Subtype: condenser
          set_number: 1
          design: closed
          cooling_tower_mode: WET

        low_pressure_flash_valve:
          type: Valve
          p_out_megapascals: 0.111   # MPa (= 1.11 bar)

        low_pressure_separator:
          type: DropletSeparator

        low_pressure_turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 0.005          # MPa (= 0.05 bar)

        low_pressure_condenser:
          type: SimpleHeatExchanger
          # No p_out here — its outlet pressure is pinned by condensate_mixer's
          # equal-pressure constraint across its inlets to match high_pressure_condenser's
          # 0.005 MPa, not an independently-declared value.
          subcooling_K: 1.0              # K below saturation: slightly subcooled condensate, so the pump never draws
                                         # exactly saturated liquid (TESPy left the condensate pump's equation
                                         # unconverged at x = 0) and has a margin against cavitation
          p0_megapascals_out1: 0.005                  # MPa -- TESPy starting guess; with no guess the
                                         # subcooled-outlet spec diverged in year 0
          h0_out1: 135                   # kJ/kg -- TESPy starting guess
          # Cost-only metadata — see high_pressure_condenser's comment above.
          Subtype: condenser
          set_number: 2
          design: closed
          cooling_tower_mode: WET

        brine_pump:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        condensate_pump:
          type: Compressor
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        condensate_mixer:
          type: Merge

        reinjection_mixer:
          type: Merge

        outlet:
          type: Sink

      edges:
        '1': {source: inlet, target: high_pressure_flash_valve}
        '2': {source: high_pressure_flash_valve, target: high_pressure_separator}
        '3': {source: high_pressure_separator, target: high_pressure_turbine, source_port: out2}    # vapor branch (1st flash)
        '4': {source: high_pressure_separator, target: low_pressure_flash_valve, source_port: out1}      # liquid branch (1st flash) -> 2nd flash
        '5': {source: low_pressure_flash_valve, target: low_pressure_separator}
        '6': {source: low_pressure_separator, target: low_pressure_turbine, source_port: out2}    # vapor branch (2nd flash)
        '7': {source: low_pressure_separator, target: brine_pump, source_port: out1}       # liquid branch (2nd flash) -> pumped back
        '8': {source: high_pressure_turbine, target: high_pressure_condenser}
        '9': {source: low_pressure_turbine, target: low_pressure_condenser}
        '10': {source: high_pressure_condenser, target: condensate_mixer, target_port: in1}
        '11': {source: low_pressure_condenser, target: condensate_mixer, target_port: in2}
        '12': {source: condensate_mixer, target: condensate_pump}
        '13': {source: brine_pump, target: reinjection_mixer, target_port: in1}
        '14': {source: condensate_pump, target: reinjection_mixer, target_port: in2}
        '15': {source: reinjection_mixer, target: outlet}

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0
    prev: 4
    next: 1
    # well_length: derived: equals reservoir.reservoir_depth (see tango.workflows.linked_quantities)
    diameter: 0.387           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 5000.0       # m
    thickness: 300.0              # m
    permeability: 5.0e-14         # m2 (~50 mD)
    porosity: 0.1
    # hydro_static_pressure: derived: brine_density x gravity x reservoir_depth (see tango.workflows.linked_quantities)
    over_pressure_percentage: 10
    # well_eff_diameter: derived: mean of the injection and production well diameters (see tango.workflows.linked_quantities)

  production_well_lower:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    # well_length: derived: reservoir.reservoir_depth minus production_well_upper.well_length (see tango.workflows.linked_quantities)
    diameter: 0.405           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    # wellhead_depth: derived: equals production_well_upper.well_length (see tango.workflows.linked_quantities)

  production_well_upper:
    type: production_well_with_pump
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 1000.0       # m
    diameter: 0.405           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    pump_efficiency: 0.55          # overall ESP string efficiency, van 't Spijker & Ungemach (2016) -- see docs/SOURCES.md#vantspijker2016
    # target_extraction_pressure is NOT set here — it's sourced from
    # sim_config.target_extraction_pressure below (see that field's
    # docstring in core/specs.py for the duplicated-value bug this fixed).
