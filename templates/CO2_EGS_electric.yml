# Design point: opt_CO2_EGS_electric's Pareto pick (the design closest to the ideal corner),
# design 17 of its outputs/pareto_results.csv (md5 bf46cdd2a3629d60e3a72aed70c70c95),
# recorded in dvc.lock at commit 45353ac7. Decision variables rounded to
# 3 significant figures.
#
# tango format — Enhanced Geothermal System (EGS) with CO2 as the working
# fluid, direct CO2 power extraction (no secondary loop).
#
# Same subsurface as CO2_EGS_ORC_electric.yml (5000 m, hypothetically
# deepened Triemli-like site -- see that file's header for why the depth
# differs from EGS_direct_heat.yml's real 3000 m), with CPG_electric.yml's
# direct surface plant instead of a binary (ORC) cycle: the CO2 expands
# through the turbine itself, condenses at an ambient-driven 5.87 MPa, and
# is brought back to injection_pressure by circulation_control. Using the
# geofluid as the turbine fluid removes the ORC's heat-exchange step and
# its losses -- the main point of a CO2 geothermal system.
#
# Reinjecting condensed, cold liquid CO2 (~800 kg/m3 at the condenser
# outlet) also keeps the
# thermosiphon strong and far from CO2's pseudo-critical density cliff --
# the failure mode the ORC version needs its injection_cooler to avoid.
#
# injection_pressure is 5.87 MPa, the condensing pressure itself and below
# CO2's 7.38 MPa critical pressure: the CO2 is reinjected as subcooled
# liquid at the condensing pressure. mass_rate (171 kg/s) and the other
# design values are set by the opt_CO2_EGS_electric Pareto pick (see the
# Design point header).
#
# Site parameters (Triemli, Zurich) — rock properties/gradient identical to
# EGS_direct_heat.yml/CO2_EGS_direct_heat.yml, depth deepened (see above):
#   surface temperature : 11 degC (284.15 K)
#   thermal gradient     : 35 degC/km (0.035 K/m)
#   fluid                : CO2
#   application          : direct CO2 electricity generation

title: Enhanced Geothermal System (EGS) with CO2, direct CO2 power extraction, hypothetical deepened Triemli-like site

common:
  fluid_name: CO2
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)  — typical crystalline basement
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  well_spacing: 500.0        # m — typical for EGS doublet

sim_config:
  num_tsteps: 25              # years
  dt_years: 1.0                # years
  target_extraction_pressure: 8_000_000  # Pa — INERT for this topology (see
                                          # CO2_EGS_direct_heat.yml's own
                                          # correction) -- kept for
                                          # consistency, not because it does
                                          # anything here (plain
                                          # production_well, no pump).
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check
  mass_rate: 171.0              # kg/s — see header comment
  bc_checkpoint_idx: 4           # component_idx of the surface (below)

economic:
  # KNOWN GAP in CAPEX coverage: EGS reservoir stimulation is not costed
  # (GitLab #66). The condenser's cooling tower IS costed (set_number 1).
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: electricity

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0           # first component solved each pass — circuit cut here
    prev: 4
    next: 1
    # well_length: derived: equals reservoir.reservoir_depth (see tango_core.workflows.linked_quantities)
    diameter: 0.409             # m  (~16-inch casing)
    pipe_roughness: 5.5e-5      # m

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 5000.0       # m (hypothetically deepened, see header comment)
    thickness: 300.0              # m
    permeability: 1.0e-13         # m2  (~100 mD — moderate EGS)
    porosity: 0.1
    # hydro_static_pressure: derived: brine_density x gravity x reservoir_depth (see tango_core.workflows.linked_quantities)
    over_pressure_percentage: 5
    # well_eff_diameter: derived: mean of the injection and production well diameters (see tango_core.workflows.linked_quantities)

  production_well_lower:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    # well_length: derived: reservoir.reservoir_depth minus production_well_upper.well_length (see tango_core.workflows.linked_quantities)
    diameter: 0.427              # m
    pipe_roughness: 5.5e-5       # m
    # wellhead_depth: derived: equals production_well_upper.well_length (see tango_core.workflows.linked_quantities)

  production_well_upper:
    type: production_well       # plain, NOT production_well_with_pump -- see header comment
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 1000.0          # m = 0.2 x reservoir_depth
    diameter: 0.427              # m
    pipe_roughness: 5.5e-5       # m

  surface:
    type: surface
    variant: graph
    component_idx: 4            # solved last, loops back to injection_well (next: 0)
    prev: 3
    next: 0
    injection_pressure: 5_870_000     # Pa — the condensing pressure, below CO2's 7.38 MPa
                                     # critical pressure: CO2 is reinjected as subcooled
                                     # liquid (see header comment).
    pipe_diameter: 0.476              # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m

    power_plant:
      # Direct CO2 plant (same topology as CPG_electric.yml): the CO2 geofluid
      # is the turbine's working fluid -- no secondary loop. Nodes in flow order.
      nodes:
        inlet:
          type: Source                 # supercritical CO2 arriving from the production wellhead

        turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 5.87      # MPa -- expands into the two-phase dome, down to the
                                         # condensing pressure. CO2 saturates at ~294 K at 5.87 MPa,
                                         # so the condenser's 3 K subcooled outlet sits at what the
                                         # cooling tower can reach here
                                         # (surface_temperature 284.15 K + approach_temperature 7 K)

        condenser:
          type: SimpleHeatExchanger
          p_out_megapascals: 5.87      # MPa -- same pressure as the turbine exhaust
          subcooling_K: 3.0              # K below saturation. The condensate flows straight into the injection
                                         # well, which must stay common.saturation_margin (5%) clear of the
                                         # saturation pressure; 3 K gives ~7% (2 K would give ~5%, too tight).
                                         # CO2 for the thermosiphon after the pump
          Subtype: condenser           # cooling-tower cost (DoubletEconomicComponent)
          set_number: 1
          design: closed
          cooling_tower_mode: WET

        circulation_control:
          type: PumpOrValve            # restores injection_pressure; here the condenser outlet
                                         # is already at about injection_pressure, so it resolves
                                         # to a small pump or throttle
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        outlet:
          type: Sink                   # CO2 leaving for injection_well

      edges:
        '1': {source: inlet, target: turbine}
        '2': {source: turbine, target: condenser}
        '3': {source: condenser, target: circulation_control}
        '4': {source: circulation_control, target: outlet}
