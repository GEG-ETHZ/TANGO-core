# Design point: opt_CO2_AGS_electric's Pareto pick (the design closest to the ideal corner),
# design 44 of its outputs/pareto_results.csv (md5 081e857746d905d6739d868d5176f70e),
# recorded in dvc.lock at commit 894a47ed. Decision variables rounded to
# 3 significant figures.
#
# tango format — Advanced Geothermal System (AGS, sealed closed loop) with
# CO2 as the working fluid, direct CO2 power extraction (no secondary loop).
#
# Same subsurface as CO2_AGS_ORC_electric.yml (hypothetically deepened
# closed loop -- see that file's header), with CPG_electric.yml's direct
# surface plant instead of a binary (ORC) cycle: the CO2 expands through the
# turbine itself, condenses at an ambient-driven 5.87 MPa, and is brought
# back to injection_pressure by circulation_control.
#
# injection_pressure is 5.87 MPa, the condensing pressure itself and below
# CO2's 7.38 MPa critical pressure: the CO2 is reinjected as subcooled
# liquid at the condensing pressure. The ORC version reinjects
# supercritical CO2 at a much higher pressure. mass_rate (70 kg/s) and the
# other design values are set by the opt_CO2_AGS_electric Pareto pick (see
# the Design point header).
#
# Site parameters (Triemli, Zurich) — rock properties/gradient as
# CO2_AGS_ORC_electric.yml:
#   surface temperature : 11 degC (284.15 K)
#   thermal gradient     : 35 degC/km (0.035 K/m)
#   fluid                : CO2
#   application          : direct CO2 electricity generation

title: Advanced Geothermal System (AGS) with CO2, direct CO2 power extraction, hypothetical deepened Triemli-like site

common:
  fluid_name: CO2
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m  (35 degC/km, Triemli site)
  surface_temperature: 284.15  # K  (11 degC, Triemli) — ambient
  surface_pressure: 100_000     # Pa — ambient

layout:
  # well_spacing: derived: equals horizontal_well.well_length (the wellheads are a loop length apart) (see tango_core.workflows.linked_quantities)

sim_config:
  num_tsteps: 25              # years of operation -- see below if depletion requires shortening
  dt_years: 1.0                # years
  target_extraction_pressure: 8_000_000  # Pa — INERT for this topology (plain
                                          # production_well, no pump) -- kept
                                          # for consistency, matching every
                                          # other CO2 config.
  injection_mode: manual       # see AGS_direct_heat.yml's module docstring: required
                                # even without a reservoir
  mass_rate: 70.0               # kg/s — see header comment
  bc_checkpoint_idx: 3           # component_idx of the surface (below)

economic:
  # The condenser's cooling tower IS costed (set_number 1).
  type: doublet
  project_maturity: green_field
  discount_rate: 0.095
  main_product: electricity

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0           # circuit entry — where the solve pass begins each timestep
    prev: 3
    next: 1
    well_length: 10_000         # m — vertical well depth (hypothetically deepened, see header comment)
    diameter: 0.405             # m  (~16-inch casing)
    pipe_roughness: 5.5e-5      # m

  horizontal_well:
    type: horizontal_well
    variant: numerical
    component_idx: 1
    prev: 0
    next: 2
    well_length: 8000           # m — horizontal loop flow-path length
    diameter: 0.75               # m
    pipe_roughness: 5.5e-5       # m
    # wellhead_depth: derived: equals injection_well.well_length (see tango_core.workflows.linked_quantities)
    angle_from_vert_deg: 90       # fully horizontal — see components/well/numerical.py

  production_well:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    # well_length: derived: equals injection_well.well_length (see tango_core.workflows.linked_quantities)
    diameter: 0.405              # m
    pipe_roughness: 5.5e-5       # m

  surface:
    type: surface
    variant: graph
    component_idx: 3            # solved last, loops back to injection_well (next: 0)
    prev: 2
    next: 0
    injection_pressure: 5_870_000    # Pa — the condensing pressure, below CO2's 7.38 MPa critical pressure; see header
    pipe_diameter: 0.345              # m
    approach_temperature: 7.0         # K
    pipe_roughness: 5.5e-5             # m

    power_plant:
      # Direct CO2 plant (same topology as CPG_electric.yml): the CO2 geofluid
      # is the turbine's working fluid -- no secondary loop. Nodes in flow order.
      nodes:
        inlet:
          type: Source                 # supercritical CO2 arriving from the production wellhead

        turbine:
          type: Turbine
          role: net_electric
          efficiency: 0.85               # turbine eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p_out_megapascals: 5.87      # MPa -- expands into the two-phase dome, down to the
                                         # condensing pressure. CO2 saturates at ~294 K at 5.87 MPa,
                                         # so the condenser's 3 K subcooled outlet sits at what the
                                         # cooling tower can reach here
                                         # (surface_temperature 284.15 K + approach_temperature 7 K)

        condenser:
          type: SimpleHeatExchanger
          p_out_megapascals: 5.87      # MPa -- same pressure as the turbine exhaust
          subcooling_K: 3.0              # K below saturation. The condensate flows straight into the injection
                                         # well, which must stay common.saturation_margin (5%) clear of the
                                         # saturation pressure; 3 K gives ~7% (2 K would give ~5%, too tight).
                                         # CO2 for the thermosiphon after the pump
          Subtype: condenser           # cooling-tower cost (DoubletEconomicComponent)
          set_number: 1
          design: closed
          cooling_tower_mode: WET

        circulation_control:
          type: PumpOrValve            # restores injection_pressure; here the condenser outlet
                                         # is already at about injection_pressure, so it resolves
                                         # to a small pump or throttle
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016

        outlet:
          type: Sink                   # CO2 leaving for injection_well

      edges:
        '1': {source: inlet, target: turbine}
        '2': {source: turbine, target: condenser}
        '3': {source: condenser, target: circulation_control}
        '4': {source: circulation_control, target: outlet}
