# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages: [pre-commit, pre-push]
# Without this, hooks all run regardless of earlier failures (pre-commit's
# default) -- pointless for check-remote-up-to-date, whose entire point is
# to skip the slow mypy/pytest hooks below it once it fails.
fail_fast: true

repos:
  # Remote freshness check (run ONLY on push, before anything else below --
  # catches a stale branch in ~1s instead of after the full mypy/pytest run)
  - repo: local
    hooks:
      - id: check-remote-up-to-date
        name: check remote is up to date before running the rest
        entry: uv run python tools/check_remote_up_to_date.py
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Fast checks (run on both commit and push just to be safe)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Local, fast checks
  - repo: local
    hooks:
      - id: hash-tango
        name: hash src/tango (for DVC dep tracking)
        entry: uv run python tools/hash_tango.py
        language: system
        files: ^src/tango/
        pass_filenames: false

  # Strict/Slow checks (run ONLY on push)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  # Built-in hooks
  # Secrets never reach a commit: gitleaks scans the staged diff.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "dvc\\.lock"
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # The RAFT example's mesh is committed on purpose so CI can run RAFT
        # without DVC credentials; other meshes go in DVC (see CONTRIBUTING.md).
        exclude: "templates/raft/AGS_single\\.msh"
      - id: no-commit-to-branch # This perfectly replaces the custom bash script by blocking commits AND pushes to main/develop
        args: [--branch, main, --branch, develop]
        stages: [pre-commit, pre-push]

  # Tests (run ONLY on push)
  - repo: local
    hooks:
      - id: pytest
        name: Run test suite (fast)
        # not slow: full-N_TSTEPS numeric parity/reference checks — a fast
        # companion at a reduced timestep count covers the same code path
        # and stays in this hook. Run `just test --all` (or `-m slow`)
        # before merging changes that could affect long-run numerics.
        # -X warn_default_encoding: see pytest.ini's filterwarnings.
        entry: uv run python -X warn_default_encoding -m pytest -m "not perf and not slow"
        language: system
        files: '\.(py|toml|yaml|yml|lock)$'
        pass_filenames: false
        stages: [pre-push]

  # Release-tag gate (run ONLY on push, LAST -- see check_full_tests_before_tag_push.py's
  # own docstring for why this can't live in CI instead). Only actually
  # runs `just test --all` when the ref being pushed is a vX.Y.Z tag; a no-op
  # for every other push, so it stays fast for normal branch pushes.
  - repo: local
    hooks:
      - id: check-full-tests-before-tag-push
        name: require `just test --all` to pass before pushing a release tag
        entry: uv run python tools/check_full_tests_before_tag_push.py
        language: system
        pass_filenames: false
        stages: [pre-push]
