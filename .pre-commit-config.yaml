# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages: [pre-commit, pre-push]
# Without this, hooks all run regardless of earlier failures (pre-commit's
# default) -- pointless for check-remote-up-to-date, whose entire point is
# to skip the slow mypy/pytest hooks below it once it fails.
fail_fast: true

repos:
  # Remote freshness check (run ONLY on push, before anything else below --
  # catches a stale branch in ~1s instead of after the full mypy/pytest run)
  - repo: local
    hooks:
      - id: check-remote-up-to-date
        name: check remote is up to date before running the rest
        entry: uv run python tools/check_remote_up_to_date.py
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Fast checks (run on both commit and push just to be safe)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Local, fast checks
  - repo: local
    hooks:
      - id: hash-tango-next
        name: hash src/tango_next (for DVC dep tracking)
        entry: uv run python tools/hash_tango_next.py
        language: system
        files: ^src/tango_next/
        pass_filenames: false

  # Strict/Slow checks (run ONLY on push)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "dvc\\.lock"
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: no-commit-to-branch # This perfectly replaces the custom bash script by blocking commits AND pushes to main/develop
        args: [--branch, main, --branch, develop]
        stages: [pre-commit, pre-push]

  # Tests (run ONLY on push)
  - repo: local
    hooks:
      - id: pytest
        name: Run test suite (fast)
        # not old_tango: deselects pure old-tango coverage (test_native.py,
        # test_data_leakage.py — parametrized over the full examples/*.yml
        # corpus, the dominant contributor to full-suite runtime) while
        # old tango (src/tango/) isn't being changed. Does NOT deselect
        # the old-vs-new parity tests, which use old tango as a reference
        # oracle for tango_next and stay in the default run. Run with
        # `uv run pytest -m old_tango` explicitly if old tango changes.
        # not slow: full-N_TSTEPS numeric parity/reference checks — a fast
        # companion at a reduced timestep count covers the same code path
        # and stays in this hook. Run `just test --all` (or `-m slow`)
        # before merging changes that could affect long-run numerics.
        entry: uv run pytest -m "not perf and not old_tango and not slow"
        language: system
        files: '\.(py|toml|yaml|yml|lock)$'
        pass_filenames: false
        stages: [pre-push]
