# Frozen copy of templates/CPG_direct_heat.yml as of 2026-10-26, used as a fixed
# scenario by test_lcoe_regression.py. The example configs change when their
# design point is re-optimized; this test needs a design whose reservoir
# depletes at a raised mass rate, so it reads this copy instead. Update it
# deliberately, not alongside the example.
# tango format — CO2 Plume Geothermal (CPG), direct-heat (district heating)
# extraction.
#
# Same doublet subsurface as CPG_electric.yml (injection_well -> reservoir
# -> production_well_lower -> production_well_upper -> surface -> back to
# injection_well), same CO2 fluid, same depth/mass_rate/target_extraction_pressure
# -- copied verbatim, see that file's header comment for the full subsurface
# rationale (why CO2 stays supercritical/dense-phase through the subsurface,
# depth/injection-pressure provenance from old tango's CPG_num_pp.yml).
#
# The surface plant differs: no turbine. A district-heating exchanger
# (district_heating_hx) takes the CO2 down to a realistic DH return
# temperature (50 degC), circulation_control throttles it to
# injection_pressure, and injection_cooler then cools it to 25 degC so it is
# reinjected cold and dense (~750 kg/m3). The cooler is what makes the loop
# work:
# - It drives the thermosiphon. Without it the CO2 leaves the plant as a
#   light gas at 50 degC (district_heating_hx's inlet is only ~32-44 bar on
#   that branch), the injection column is light, and the wellhead pressure
#   collapses with it.
# - It lets the reservoir supply the heat. Without it, compressing that gas
#   back up to injection_pressure heats it so much that it reaches the
#   bottom of the injection well at ~122 degC, hotter than the ~102 degC
#   reservoir: the reservoir is heated rather than mined, and all the
#   "delivered" heat is pump work.
# With it, the wellhead delivers ~120-130 bar, circulation_control resolves
# to a passive Valve, and the injection well's bottom-hole pressure peaks at
# ~27.9 MPa, under the 30 MPa fracking threshold. The heat rejected below
# 50 degC is too cold for the district-heating network. mass_rate is 75
# kg/s (not CPG_electric.yml's 125): at 100 kg/s and above the reservoir
# depletes until the CO2 reaches the plant colder than the 50 degC return
# within the 20-year run.

title: CO2 Plume Geothermal (CPG), doublet, direct-heat extraction

description:
  summary: CPG doublet with supercritical-CO2 direct-heat extraction (companion to CPG_electric.yml)
  date: "2026-09-25"
  description: >
    Single-doublet CO2 Plume Geothermal system, same subsurface as
    CPG_electric.yml, with a district-heating heat exchanger instead of a
    turbine/condenser power plant, and an injection cooler that reinjects the
    CO2 cold and dense to drive the thermosiphon. The CO2 never enters the
    two-phase dome.

common:
  fluid_name: CO2
  rock_density: 2650.0       # kg/m3
  rock_cp: 1000.0            # J/(kg*K)
  rock_k: 2.1                # W/(m*K)
  thermal_gradient: 0.035    # K/m
  surface_temperature: 288   # K — ambient
  surface_pressure: 100_000  # Pa — ambient

layout:
  well_spacing: 707.0        # m

sim_config:
  num_tsteps: 20
  dt_years: 1.0                # years
  target_extraction_pressure: 8_000_000  # Pa — INERT for this topology: only
                                          # threaded to the surface component
                                          # and pump-bearing production wells,
                                          # and this config's production_well_upper
                                          # is plain (no pump) -- see header
                                          # comment's 2026-09-25 correction.
                                          # Kept at CPG_electric.yml's own value
                                          # for consistency, not because it does
                                          # anything here.
  injection_mode: manual-fracking-check  # InjectionPolicy: manual | manual-fracking-check
  mass_rate: 75                 # kg/s -- lowest LCOE that keeps heat output positive for 20 years (see header)
  bc_checkpoint_idx: 4           # component_idx of the surface (below)

economic:
  # Same CAPEX-coverage caveat as AGS_direct_heat.yml/hydro_direct_heat.yml:
  # the district-heating exchanger has no Subtype: cooler/condenser tag, so
  # it isn't costed until a direct-heat-exchanger cost formula is ported.
  # injection_cooler is costed as a cooling tower.
  type: doublet
  project_maturity: brown_field  # matches CPG_electric.yml/old tango's CPG_num_pp.yml
  discount_rate: 0.095
  main_product: heat

components:

  injection_well:
    type: injection_well
    variant: numerical
    component_idx: 0          # first component solved each pass — circuit cut here
    prev: 4
    next: 1
    # well_length: derived: equals reservoir.reservoir_depth (see tango_core.workflows.linked_quantities)
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness

  reservoir:
    type: reservoir
    variant: lumped
    component_idx: 1
    prev: 0
    next: 2
    reservoir_depth: 2500.0       # m — matches CPG_electric.yml exactly
    thickness: 300.0              # m
    permeability: 5.0e-14         # m2 (~50 mD)
    porosity: 0.1
    # hydro_static_pressure: derived: brine_density x gravity x reservoir_depth (see tango_core.workflows.linked_quantities)
    over_pressure_percentage: 20
    brine_density: 1000            # kg/m3 — used for the reservoir's own
                                    # initial/undepleted pressure, not the
                                    # circulating fluid (see brine_density's
                                    # own docstring in core/specs.py)
    # well_eff_diameter: derived: mean of the injection and production well diameters (see tango_core.workflows.linked_quantities)

  production_well_lower:
    type: production_well
    variant: numerical
    component_idx: 2
    prev: 1
    next: 3
    # well_length: derived: reservoir.reservoir_depth minus production_well_upper.well_length (see tango_core.workflows.linked_quantities)
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    # wellhead_depth: derived: equals production_well_upper.well_length (see tango_core.workflows.linked_quantities)

  production_well_upper:
    type: production_well
    variant: numerical
    component_idx: 3
    prev: 2
    next: 4
    well_length: 500.0        # m
    diameter: 0.410           # m
    pipe_roughness: 55.e-6    # m — absolute pipe wall roughness
    # target_extraction_pressure is NOT set here — it's sourced from
    # sim_config.target_extraction_pressure above.

  surface:
    type: surface
    variant: graph
    component_idx: 4          # solved last (surface consumes production well output)
    prev: 3
    next: 0
    injection_pressure: 7_500_000   # Pa — chosen ABOVE CO2's 7.38 MPa critical
                                     # pressure (unlike CPG_electric.yml's
                                     # 7_131_030 Pa condensed-liquid case), keeping
                                     # this reinjection point single-phase after
                                     # injection_cooler.
    pipe_diameter: 0.41        # m
    approach_temperature: 7.0  # K
    pipe_roughness: 55.e-6     # m — absolute pipe wall roughness

    power_plant:
      # Direct-heat surface plant: inlet -> district_heating_hx ->
      # circulation_control -> injection_cooler -> outlet. See the header
      # comment for why the cooler is needed.
      nodes:
        inlet:
          type: Source
        district_heating_hx:
          type: SimpleHeatExchanger
          role: net_thermal
          T_out: 323.15    # K (50 degC) — district-heating return temperature
          pressure_ratio: 0.975   # 2.5% heat-exchanger pressure loss (not an absolute p_out:
                                  # the wellhead pressure changes over the run, and a fixed
                                  # outlet above the inlet would be free compression)
          p0_megapascals_out1: 6             # MPa -- TESPy starting guess only; without it, TESPy's default
                                  # guess is below CO2's triple-point pressure and the solve fails
        circulation_control:
          type: PumpOrValve
          role: net_electric
          efficiency: 0.75               # pump eta_s, DiPippo (2016) -- see docs/SOURCES.md#dipippo2016
          p0_megapascals_out1: 7.5      # MPa (near injection_pressure above) — TESPy guess value;
                                # the {N} port suffix is required even for a single-port node
        injection_cooler:
          type: SimpleHeatExchanger    # cools the CO2 before reinjection -- see header comment
          T_out: 298.15                # K (25 degC) -- cold, dense CO2; above the 22 degC cooling
                                       # limit (15 degC surface + 7 K approach)
          pressure_ratio: 1.0          # no pressure drop
          p0_megapascals_out1: 7.5                  # MPa -- TESPy starting guess for the outlet pressure
          h0_out1: 260                 # kJ/kg -- TESPy starting guess for the outlet enthalpy
          Subtype: cooler              # cooling-tower cost (DoubletEconomicComponent)
          set_number: 1
          design: closed
          cooling_tower_mode: WET
        outlet:
          type: Sink
      edges:
        '1': {source: inlet, target: district_heating_hx}
        '2': {source: district_heating_hx, target: circulation_control}
        '3': {source: circulation_control, target: injection_cooler}
        '4': {source: injection_cooler, target: outlet}
