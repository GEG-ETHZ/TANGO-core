  n_generation: 10
  pop_size: 20
  variables:
    MASS_FLOW_RATE:
      lower_bound: 220.0
      upper_bound: 240.0
      type: continuous
#    THICKNESS:
#      lower_bound: 270.0
#      upper_bound: 300.0
#      type: continuous
  targets:
    - W_NET
    - INLET_TEMP
  target_type:
    - maximize
    - maximize
  constraints:
    INLET_TEMP:
      lower_bound: 330.0
  parallel_processing: yes
  n_processes: 20
  final_selection: 'ASF'  # or 'pseudo_weights'
  weights: [0.01, 0.99]
