graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    prd_2:
      type: 'production_well_pump'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_flexible'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'prd_2'
    5:
      source: 'prd_2'
      target: 'surface'

# simulation input

runspec:
  title: 'District heating application'
  workflow: 'native'

props:
  fluid_name: 'H2O'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
  rock_k: 2.1  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.035  # degC/m

surface:
  surface_temperature: 288  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  target_extraction_pressure: 7000000

reservoir:
  reservoir_depth: 5000.0 # m
  thickness: 300.0 # m
  permeability: 5.0e-14    # m2 ~50mD
  porosity: 0.1
  hydro_static_pressure: 50000000
  over_pressure_percentage: 10

injection_well:
  well_length: 5000. # m
  diameter: 0.410 # m
  well_length_seq: [ 5000. ]
  well_diameter_seq: [ 0.410 ]

production_well:
  well_length: 4000. # m
  diameter: 0.410 # m
  well_length_seq: [ 5000. ]
  well_diameter_seq: [ 0.410 ]

production_well_pump:
  well_length: 1000. # m
  diameter: 0.410 # m

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default
    sizing_strategy: average_performance

schedule:
  main_product: 'heat'
  electricity_price: 0.24999
  bc_iteration_checkpoint: injection_well_bottom
  mass_flow_rate: 50.0  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET' # DOUBLET, INVERTED_5SPOT, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 20 # number of time steps
    dt: 1.0  # time step increment (year)
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: manual
    value: 50

economic:
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095

addons:
  ThermaGraph:
    active: 'no'
    execute: 'no'
    states_file: '/Users/morteza/Documents/projects/TANGO/src/tango/states_test2.json'
    connections_file: '/Users/morteza/Documents/projects/TANGO/src/tango/connections_test2.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: '/Users/morteza/Documents/projects/TANGO/src/tango/aaaa.csv'

power_plant_graph:
  nodes:
    inlet:
      type: 'Source'
      unit: 'native'
    outlet:
      type: 'Sink'
      unit: 'native'
    DH:
      type: 'SimpleHeatExchanger'
      unit: 'native'

  edges:
    1:
      source: 'inlet'
      target: 'DH'
    2:
      source: 'DH'
      target: 'outlet'

DH:
  Subtype: 'DH_component'
  T_out: 40
#  p_out: 0.5
