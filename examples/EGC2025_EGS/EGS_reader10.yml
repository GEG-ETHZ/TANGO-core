#
# testcase1: CPG (Doublet, green_field)
#

graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'filereader'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_flexible'
#      unit: 'native_CPG'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'

# simulation input

runspec:
  title: 'CPG DOUBLET'
  workflow: 'native'

props:
  fluid_name: 'CO2'
  brine_density: 1000 # kg/m3
  rock_density: 2500.0 # kg/m3
  rock_cp: 900.0  # # specific heat capacity (J/(kg*K))
  rock_k: 3.0  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.03  # degC/m

surface:
  surface_temperature: 283.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.3 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.8  # (-)

reservoir:
  reservoir_depth: 2500.0 # m
  thickness: 300.0 # m
  permeability: 5.0e-14    # m2 ~50mD
  porosity: 0.1
  hydro_static_pressure: 25000000
  over_pressure_percentage: 10
  inlet_state: 'examples/EGC2025_EGS/inj10.csv'
  outlet_state:  'examples/EGC2025_EGS/pro10.csv'

injection_well:
  well_length: 2586.228 # m
  diameter: 0.3 # m
  well_length_seq: [ 2586.228, 877.824 ]
  well_diameter_seq: [ 0.3, 0.3 ]

production_well:
  well_length: 2586.228 # m
  diameter: 0.3 # m
  well_length_seq: [ 2586.228, 914.4, 914.4 ]
  well_diameter_seq: [ 0.3, 0.3, 0.3 ]

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default
    sizing_strategy: average_performance

schedule:
  bc_iteration_checkpoint: injection_well_bottom
  injection_pressure: 1000000
  mass_flow_rate: 200.0  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET' # doublet, inverted_5spot, 5spot
  well_spacing: 914.4 # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 20 # number of time steps
    dt: 1.0  # time step increment (year)
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: automatic
    value: 1030

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095

addons:
  ThermaGraph:
    active: 'yes'
    execute: 'yes'
    states_file: 'thermagraph_states.json'
    connections_file: 'thermagraph_connections.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: 'src/tango/aaaa.csv'

power_plant_graph:
  nodes:
    inlet:
      type: 'Source'
      unit: 'native'
    turbine:
      type: 'Turbine'
      unit: 'native'
    cooler:
      type: 'SimpleHeatExchanger'
      unit: 'native'
    pump:
      type: 'Compressor'
      unit: 'native'
    outlet:
      type: 'Sink'
      unit: 'native'
  edges:
    1:
      source: 'inlet'
      target: 'turbine'
    2:
      source: 'turbine'
      target: 'cooler'
    3:
      source: 'cooler'
      target: 'pump'
    4:
      source: 'pump'
      target: 'outlet'

turbine:
  efficiency: 1.0
  p_out: 75
#  T_out: 87

