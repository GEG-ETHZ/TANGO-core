#
# testcase3: INVERTED_5SPOT case based on: https://www.sciencedirect.com/science/article/pii/S0960148120318978?via%3Dihub
#

runspec:
  workflow: # dict: {'compute node name': 'model name'}
    injection_well: 'Adams'
    reservoir: 'Adams'
    production_well: 'Adams'
    surface: 'AdamsCPG'  # CPG (for CO2) or ORC (for H2O)
    economic: 'Adams'

common:
  fluid_name: 'CO2'
  mass_flow_rate: 350.0  # kg/s (injection rate)
  reservoir_depth: 2500.0 # m
  rock_density: 2300.0
  rock_cp: 920.0  # J/kg K
  rock_k: 2.1  # W/m K
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  well_pattern: 'INVERTED_5SPOT' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # length of inj-prod pair in m
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  thermal_gradient: 0.035  # degC/m
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 5 # number of time steps
  dt: 1.0  # time step increment (year)

reservoir:
  thickness: 300.0
  permeability: 5.0e-14    # m2 ~50mD
  porosity: 0.1

injection_well:
  vertical_deviation: 0.0  # degrees
  diameter: 0.410 # m

production_well:
  vertical_deviation: 0.0  # degrees
  diameter: 0.410 # m

surface:
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

economic:
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095




