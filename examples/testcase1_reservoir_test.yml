#
# testcase1: CPG (Doublet, green_field)
#

graph:
  nodes:
    inj_1: # unit name
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_CPG'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'

# simulation input

runspec:
  title: 'CPG DOUBLET'
  workflow: 'native'

props:
  fluid_name: 'CO2'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
  rock_k: 2.1  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.035  # degC/m

surface:
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

reservoir:
  reservoir_depth: 2000.0 # m
  thickness: 5.0 # m
#  thickness: 50.0 # m
  initial_pressure: 19629350. # Pa
  initial_temperature: 393.27 # deg. C
  permeability: 9.8692326671601E-14 # m2 ~100mD
  porosity: 0.2

injection_well:
  well_length: 2000. # m
  diameter: 0.410 # m

production_well:
  well_length: 2000. # m
  diameter: 0.410 # m

schedule:
  mass_flow_rate: 0.2163  # kg/s (=18690.8 kg/day)
#  mass_flow_rate: 0.4326  # kg/s (=2*18690.8 kg/day)
  well_pattern: 'DOUBLET' # doublet, inverted_5spot, 5spot
#  well_pattern: 'INVERTED_5SPOT' # doublet, inverted_5spot, 5spot
  well_spacing: 300. # m (inj-prod pair)
#  well_spacing: 705. # m (inj-prod pair)
#  well_spacing: 125. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 12 # number of time steps
  dt: 0.0833  # month

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095
  num_reusable_injectors: 0
  num_reusable_producers: 0
