common:
  fluid_name: 'CO2'
  mass_flow_rate: 10.0  # kg/s
  dt: 1.0  # year
  reservoir_depth: 5000.0
  rock_density: 2300.0
  rock_cp: 1000.0  # J/kg K
  rock_k: 2.1  # W/m K
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  thermal_gradient: 0.03  # degC/m

horizontal_well:
  well_length: 2000.0 # m
  diameter: 0.3  # m
  num_cells: 300
  epsilon: 55.e-6  # m
  gravity_scale_factor: 0.0  # no gravity effects in horizontal wells

injection_well:
  vertical_deviation: 0.0  # degrees
  diameter: 0.5  # m
  num_cells: 300
  epsilon: 55.e-6  # m
  gravity_scale_factor: -1.0
  rock_k: 1.0e-3

production_well:
  vertical_deviation: 0.0  # degrees
  diameter: 0.5  # m
  num_cells: 300
  epsilon: 55.e-6  # m
  gravity_scale_factor: 1.0
  rock_k: 1.0e-3
