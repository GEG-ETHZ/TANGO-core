graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_flexible'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'

# simulation input

runspec:
  title: 'CPG with flexible power plant and manual flow rate'
  workflow: 'native'

props:
  fluid_name: 'CO2'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
  rock_k: 2.1  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.035  # degC/m

surface:
  surface_temperature: 288  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  target_extraction_pressure: 7000000

reservoir:
  reservoir_depth: 5000.0 # m
  thickness: 300.0 # m
  permeability: 5.0e-15    # m2 ~50mD
  porosity: 0.1
  hydro_static_pressure: 50000000
  over_pressure_percentage: 10

injection_well:
  well_length: 5000. # m
  diameter: 0.410 # m
  well_length_seq: [ 5000. ]
  well_diameter_seq: [ 0.410 ]

production_well:
  well_length: 5000. # m
  diameter: 0.410 # m
  well_length_seq: [ 5000. ]
  well_diameter_seq: [ 0.410 ]

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default
    sizing_strategy: average_performance

schedule:
  bc_iteration_checkpoint: injection_well_bottom
  injection_pressure: 7100000
  mass_flow_rate: 0.1  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 20 # number of time steps
    dt: 1.0  # time step increment (year)
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: manual
    value: 50

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095

addons:
  ThermaGraph:
    active: 'no'
    execute: 'no'
    states_file: 'src/tango/states_test2.json'
    connections_file: 'src/tango/connections_test2.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: 'src/tango/aaaa.csv'

power_plant_graph:
  nodes:
    inlet:
      type: 'Source'
      unit: 'native'
    turbine:
      type: 'Turbine'
      unit: 'native'
    cooler:
      type: 'SimpleHeatExchanger'
      unit: 'native'
    condenser:
      type: 'SimpleHeatExchanger'
      unit: 'native'
    pump:
      type: 'Compressor'
      unit: 'native'
    outlet:
      type: 'Sink'
      unit: 'native'
  edges:
    1:
      source: 'inlet'
      target: 'turbine'
    2:
      source: 'turbine'
      target: 'cooler'
    3:
      source: 'cooler'
      target: 'condenser'
    4:
      source: 'condenser'
      target: 'pump'
    5:
      source: 'pump'
      target: 'outlet'

turbine:
  efficiency: 0.9
  p_out: 72
#  T_out: 87

cooler:
  Subtype: 'cooler'
  design: 'closed'
  cooling_tower_mode: 'WET'
  set_number: 1
  p_out: 71
  vapor_mass_fraction_out: 1

condenser:
  Subtype: 'condenser'
  design: 'closed'
  cooling_tower_mode: 'WET'
  set_number: 1
  p_out: 70
  vapor_mass_fraction_out: 0

pump:
  efficiency: 0.99
#  p_out: 80
#  T_out: 18
