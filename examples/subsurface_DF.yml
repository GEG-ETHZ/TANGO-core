#
# testcase1: CPG (Doublet, green_field)
#

graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'filereader'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_flexible'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'

# simulation input

runspec:
  title: 'CPG DOUBLET'
  workflow: 'native'

props:
  fluid_name: 'H2O'
  brine_density: 1000 # kg/m3
  rock_density: 2400.0 # kg/m3
  rock_cp: 900.0  # # specific heat capacity (J/(kg*K))
  rock_k: 2.4  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.03  # degC/m

surface:
  surface_temperature: 283.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

reservoir:
  reservoir_depth: 2500.0 # m
  thickness: 300.0 # m
  permeability: 5.0e-14    # m2 ~50mD
  porosity: 0.1
  hydro_static_pressure: 25000000
  over_pressure_percentage: 10
  inlet_state: '/home/morteza/projects/TANGO/examples/subsurface_inlet.csv'
  outlet_state:  '/home/morteza/projects/TANGO/examples/subsurface_outlet.csv'

injection_well:
  well_length: 1. # m
  diameter: 0.3 # m
  well_length_seq: [ 1. ]
  well_diameter_seq: [ 0.3 ]

production_well:
  well_length: 1. # m
  diameter: 0.3 # m
  well_length_seq: [ 1. ]
  well_diameter_seq: [ 0.3 ]

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default
    sizing_strategy: average_performance

schedule:
  bc_iteration_checkpoint: injection_well_bottom
  injection_pressure: 1000000
  mass_flow_rate: 200.0  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 50 # number of time steps
    dt: 1.0  # time step increment (year)
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: automatic
    value: 1030

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095

addons:
  ThermaGraph:
    active: 'no'
    execute: 'no'
    states_file: 'src/tango/states_test2.json'
    connections_file: 'src/tango/connections_test2.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: 'src/tango/aaaa.csv'

power_plant_graph:
  nodes:
    inlet:
      type: 'Source'
      unit: 'native'
    valve1:
      type: 'Valve'
      unit: 'native'
    droplet_separator1:
      type: 'DropletSeparator'
      unit: 'native'
    turbine1:
      type: 'Turbine'
      unit: 'native'
    condenser1:
      type: 'SimpleHeatExchanger'
      unit: 'native'
    valve2:
      type: 'Valve'
      unit: 'native'
    droplet_separator2:
      type: 'DropletSeparator'
      unit: 'native'
    turbine2:
      type: 'Turbine'
      unit: 'native'
    condenser2:
      type: 'SimpleHeatExchanger'
      unit: 'native'
    pump1:
      type: 'Compressor'
      unit: 'native'
    pump2:
      type: 'Compressor'
      unit: 'native'
    turbine1_outlet:
      type: 'Sink'
      unit: 'native'
    gas_flow_sink:
      type: 'Sink'
      unit: 'native'
    outlet:
      type: 'Sink'
      unit: 'native'
    merge2:
      type: 'Merge'
      unit: 'native'
    merge1:
      type: 'Merge'
      unit: 'native'

  edges:
    1:
      source: 'inlet'
      target: 'valve1'
    2:
      source: 'valve1'
      target: 'droplet_separator1'
    3:
      source: 'droplet_separator1'
      source_port: 'out2'
      target: 'turbine1'
      target_port: 'in1'
    5:
      source: 'droplet_separator1'
      source_port: 'out1'
      target: 'valve2'
    6:
      source: 'valve2'
      target: 'droplet_separator2'
    7:
      source: 'droplet_separator2'
      source_port: 'out2'
      target: 'turbine2'
      target_port: 'in1'
    8:
      source: 'droplet_separator2'
      source_port: 'out1'
      target: 'pump1'
    10:
      source: 'turbine2'
      target: 'condenser2'
    12:
      source: 'pump1'
      source_port: 'out1'
      target: 'merge2'
      target_port: 'in1'
    13:
      source: 'pump2'
      source_port: 'out1'
      target: 'merge2'
      target_port: 'in2'
    14:
      source: 'merge2'
      target: 'outlet'
    15:
      source: 'turbine1'
      target: 'condenser1'
    17:
      source: 'condenser2'
      source_port: 'out1'
      target: 'merge1'
      target_port: 'in2'
    18:
      source: 'condenser1'
      source_port: 'out1'
      target: 'merge1'
      target_port: 'in1'
    19:
      source: 'merge1'
      target: 'pump2'

valve1:
  p_out: 1

turbine1:
  efficiency: 1.0
  p_out: 0.05

condenser1:
  Subtype: 'condenser'
  design: 'closed'
  cooling_tower_mode: 'WET'
  set_number: 1
  p_out: 0.05
  vapor_mass_fraction_out: 0

valve2:
  p_out: 0.5

turbine2:
  efficiency: 1.0
  p_out: 0.05

condenser2:
  Subtype: 'condenser'
  design: 'closed'
  cooling_tower_mode: 'WET'
  set_number: 2
#  p_out: 0.05
  vapor_mass_fraction_out: 0

pump1:
  efficiency: 1.0
#  p_out: 30

pump2:
  efficiency: 1.0
