modules:
  - label: "Heat Generators"
    fields:
      - key: "name"
        values:
          - "heat boiler natural gas"
          - "Heat Pump Air - Ammoniak"

      - key: "installed capacity (MW_th)"
        values: [5, 5]

      - key: "efficiency th"
        values: [0.9, 3.41]

      - key: "efficiency el"
        values: [0, 0]

      - key: "investment costs (EUR/MW_th)"
        values: [60000, 777000]

      - key: "OPEX fix (EUR/MWa)"
        values: [2000, 2000]

      - key: "OPEX var (EUR/MWh)"
        values: [1.1, 8.4]

      - key: "Coldstart Costs (EUR/Start)"
        values: [1000, 1000]

      - key: "life time"
        values: [25, 25]

      - key: "renewable factor"
        values: [0, 0]

      - key: "must run [0-1]"
        values: [0, 0]

      - key: "Maximal Available Potential [MWh]"
        values: [0, 0]

      - key: "Maximal Output Power [MW]"
        values: [0, 0]

      - key: "Excess Heat Source Price [EUR/MWh]"
        values: [0, 0]

      - key: "Ramping Costs [EUR/MWh]"
        values: [0, 0]

      - key: "type"
        values: ["boiler", "Heat Pump Air"]

      - key: "COP source temperature sensitivity (1/°C)"
        values: [0, 0.0387]

      - key: "COP flow temperature sensitivity (1/°C)"
        values: [0, -0.0159]

      - key: "COP return temperature sensitivity (1/°C)"
        values: [0, -0.0046]

      - key: "min shutoff source temperature (°C)"
        values: [0, -10]

      - key: "fade out temp where power reduction starts (°C)"
        values: [0, -2]

      - key: "Source Temperature (°C)"
        values: [0, -1]

      - key: "Nominal Inlet Temperature (°C)"
        values: [0, 70]

      - key: "Nominal Return Temperature (°C)"
        values: [0, 35]

      - key: "Refrigerants"
        values: [null, "Ammoniak"]

      - key: "Maximum Power of the Heatpump Compressor Pel (MW)"
        values: [0, 0]

      - key: "Minimum Output Power Factor [0-1]"
        values: [0, 0]

      - key: "Electricity price"
        values: [null, null]

      - key: "Sale Electricity price"
        values: [null, null]

  - label: "prices and emmision factors"
    fields:
      - key: "energy carrier"
        values:
          - "ambient heat"
          - "electricity"
          - "CHP gas"
          - "gas/oil"
          - "natural gas"
          - "straw"
          - "various"
          - "waste"
          - "waste heat 20°"
          - "waste heat 40°"
          - "wood chips"
          - "wood pellets"
          - "radiation"

      - key: "prices(EUR/MWh)"
        values: [0, 0, 100, 85, 100, 65, 20, 5, 0, 0, 45, 65, 0]

      - key: "emission factor [tCO2/MWh]"
        values: [0, 0.243, 0.227, 0.267, 0.202, 0, 0, 0, 0, 0, 0, 0, 0]

  - label: "Data"
    fields:
      - key: "CO2 Price [EUR/tC02]"
        values: [25]

      - key: "Interest Rate [0-1]"
        values: [0.05]

      - key: "Minimum Renewable Factor [0-1]"
        values: [0]

      - key: "Total Demand[ MWh]"
        values: [50000]

  - label: "Heat Storage"
    fields:
      - key: "name"
        values:
          - "default heat storage"

      - key: "Storage Capacity [MWh]"
        values: [0]

      - key: "Hourly Stoarge Losses [%]"
        values: [0.007]

      - key: "maximum unloading power  [MW]"
        values: [3]

      - key: "maximum loading power [MW]"
        values: [3]

      - key: "loading efficiency"
        values: [0.95]

      - key: "unloading efficiency"
        values: [0.95]

      - key: "Invesment costs for additional storage capacity  [€/MWh]"
        values: [400]

      - key: "OPEX fix [€/MWh]"
        values: [0]

      - key: "Life Time [a]"
        values: [25]

  - label: "Energy Carrier"
    fields:
      - key: "name"
        values:
          - "heat boiler natural gas"
          - "Heat Pump Air - Ammoniak"

      - key: "carrier"
        values:
          - "natural gas"
          - "electricity"

  - label: "Default - External Data"
    fields:
      - key: "Radiation"
        values: [" Wien # 2016 "]

      - key: "Temperature"
        values: [" Wien # 2016 "]

      - key: "Electricity price"
        values: [" Wien # 2016 "]

      - key: "Sale Electricity price"
        values: [" Wien # 2016 "]

      - key: "Heat Demand"
        values: [" Wien # 2016 "]

      - key: "Inlet Temperature"
        values: [" VL(105/85)RL(60) # 2016 "]

      - key: "Return Temperature"
        values: [" VL(105/85)RL(60) # 2016 "]

      - key: "River Temperature"
        values: [" Wien # 2016 "]

      - key: "Waste Water Temperature"
        values: [" Wien # 2016 "]
