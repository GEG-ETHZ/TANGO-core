#
# testcase5: ORC (x1 Inverted 5spot, green_field)
#

graph:
  nodes:
    injection_wellbore: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    production_well_lower:
      type: 'production_well'
      unit: 'native'
    production_well_upper:
      type: 'production_well_pump'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_ORC'
  edges:
    1:
      source: 'surface'
      target: 'injection_wellbore'
    2:
      source: 'injection_wellbore'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'production_well_lower'
    4:
      source: 'production_well_lower'
      target: 'production_well_upper'
    5:
      source: 'production_well_upper'
      target: 'surface'


# simulation input

runspec:
  title: 'ORC 1xINV5SPOT'
  workflow: 'native'

props:
  fluid_name: 'H2O'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
  rock_k: 2.1  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.035  # degC/m
surface:
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)
  refrigerant: 'R245fa'
  ORC_opt_mode: 'min_cost' # min_cost or max_power

reservoir:
  reservoir_depth: 2500.0 # m
  thickness: 100.0 # m
  permeability: 1.5e-13 # m2
  porosity: 0.1
  hydro_static_pressure: 25000000
  over_pressure_percentage: 20

injection_well:
  well_length: 2500. # m
  diameter: 0.410 # m
  well_length_seq: [ 2500. ]
  well_diameter_seq: [ 0.410 ]

production_well:
  well_length: 2000. # m
  diameter: 0.410 # m
  well_length_seq: [ 2500. ]
  well_diameter_seq: [ 0.410 ]

production_well_pump:
  well_length: 500. # m
  diameter: 0.410 # m
  well_length_seq: [ 2500. ]
  well_diameter_seq: [ 0.410 ]

functions:
  dts:
    type: segmented_linear
    time: [0, 5]
    dt: [1, 1 ]
    end_time: 5

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default

schedule:
  bc_iteration_checkpoint: injection_well_bottom
  mass_flow_rate: 0.1  # kg/s (injection rate per pattern)
  well_pattern: 'INVERTED_5SPOT' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 20 # number of time steps
    dt: 1.0  # time step increment (year)
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: manual
    value: 100

economic:
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095

addons:
  ThermaGraph:
    active: 'no'
    execute: 'no'
    states_file: 'src/tango/states_test2.json'
    connections_file: 'src/tango/connections_test2.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: 'src/tango/alpha.csv'

arangodb:
  enabled: 'yes'
  database: 'tango_geothermal'