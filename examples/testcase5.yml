#
# testcase5: ORC (x1 Inverted 5spot, green_field)
#

runspec:
  title: 'ORC 1xINV5SPOT'
  workflow: 'native' # type of physical system

graph:
  specs: # common specs shared across graph (rock / fluid properties, initial condition, etc.)
    fluid_name: 'H2O'
    brine_density: 1000 # kg/m3
    rock_density: 2650.0 # kg/m3
    rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
    rock_k: 2.1  # thermal conductivity (W/(m*K))
    thermal_gradient: 0.035  # degC/m
    surface_temperature: 288.15  # K
    surface_pressure: 100_000  # Pa
  nodes:
    # compute nodes. each consists of a model and its state
    inj_1: # unique id
      type: 'injection_well'
      model: 'native'
      specs:
        well_length: 2500. # m
        diameter: 0.410 # m
    reservoir:
      type: 'reservoir'
      model: 'native'
      specs:
        thickness: 100.0 # m
        permeability: 1.5e-13 # m2
        porosity: 0.1
        reservoir_depth: 2500.0 # m
    prd_1:
      type: 'production_well'
      model: 'native'
      specs:
        well_length: 2000. # m
        diameter: 0.410 # m
    prd_2:
      type: 'production_well_pump'
      model: 'native'
      specs:
        well_length: 500. # m
        diameter: 0.410 # m
    surface:
      type: 'surface'
      model: 'native_ORC'
      specs:
        pipe_diameter: 0.41 # m
        approach_temperature: 7.0  # K
        condensation_pressure_offset: 50_000.0  # Pa
        eta_turbine: 0.78  # (-)
        refrigerant: 'R245fa'
        ORC_opt_mode: 'min_cost' # min_cost or max_power
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'prd_2'
    5:
      source: 'prd_2'
      target: 'surface'

schedule:
  mass_flow_rate: 40.0  # kg/s (injection rate per pattern)
  well_pattern: 'INVERTED_5SPOT' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 5 # number of time steps
  dt: 1.0  # time step increment (year)

economic:
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095

