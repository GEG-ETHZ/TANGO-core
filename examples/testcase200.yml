#
# testcase10: AGS (MOOSE + DWSIM)
#

graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'moose'
    surface:
      type: 'surface'
      unit: 'native_CPG'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'surface'

# simulation input

runspec:
  title: 'AGS (MOOSE + DWSIM)'
  workflow: 'native'

props:
  fluid_name: 'CO2'
  brine_density: 1000 # kg/m3
  rock_density: 2200.0 # kg/m3
  rock_cp: 850.0  # # specific heat capacity (J/(kg*K))
  rock_k: 3.0  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.03  # degC/m

surface:
  surface_temperature: 283.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.1429 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

injection_well:
  well_length: 5000. # m
  diameter: 0.2429 # m
  epsilon: 1.e-4  # roughness of the well (m)
  yaml_file_path: "/Users/morteza/Documents/projects/TANGO/examples/testcase200.yml"
  template_file_path: "/Users/morteza/Documents/projects/TANGO/examples/AGS_Mahmoud_template.i"
  output_file_name: "AGS_Mahmoud.i"
  moose_input_path: '/Users/morteza/Documents/projects/moskito2/AGS_Mahmoud.i'
  post_processor_path: '/Users/morteza/Documents/projects/TANGO/src/tango/gg_out.csv'

production_well:
  well_length: 4000. # m
  diameter: 0.2429 # m

reservoir:
  reservoir_depth: 5000.0 # m
  thickness: 5000.0 # m
  permeability: 1.0e-12    # m2 ~50mD
  porosity: 0.1


schedule:
  mass_flow_rate: 20.0  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 100 # number of time steps
  dt: 1.0  # time step increment (year)
  end_time: 630720000

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095
