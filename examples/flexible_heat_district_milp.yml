# TANGO Example: Geothermal District Heating with MILP Optimizer
# This configuration runs geothermal simulation and then MILP optimization
# for hybrid energy system dispatch (alternative to HotmapsDispatch)
#
# MILP uses JSON scenario files (not Excel like HotmapsDispatch)
# Available scenarios in TANGO/src/tango/addons/MILP/scenarios/:
#   - with_all_HP.json (default) - All technologies + 4 heat pump types
#   - all_CHP.json - CHP technologies
#   - baseline.json - Basic setup
#   - geothermal_only.json - Only geothermal

graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    prd_2:
      type: 'production_well_pump'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_flexible'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'prd_2'
    5:
      source: 'prd_2'
      target: 'surface'

# Simulation input
runspec:
  title: 'District heating with MILP optimizer'
  workflow: 'native'

props:
  fluid_name: 'H2O'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # specific heat capacity (J/(kg*K))
  rock_k: 2.1  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.035  # degC/m

surface:
  surface_temperature: 288  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  target_extraction_pressure: 7000000

reservoir:
  reservoir_depth: 2000.0 # m
  thickness: 300.0 # m
  permeability: 5.0e-14    # m2 ~50mD
  porosity: 0.1
  hydro_static_pressure: 50000000
  over_pressure_percentage: 10

injection_well:
  well_length: 2000. # m
  diameter: 0.410 # m
  well_length_seq: [ 2000. ]
  well_diameter_seq: [ 0.410 ]

production_well:
  well_length: 1600. # m
  diameter: 0.410 # m
  well_length_seq: [ 2000. ]
  well_diameter_seq: [ 0.410 ]

production_well_pump:
  well_length: 400. # m
  diameter: 0.410 # m

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default
    sizing_strategy: average_performance

schedule:
  main_product: 'heat'
  electricity_price: 0.24999
  bc_iteration_checkpoint: injection_well_bottom
  mass_flow_rate: 0.1  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET'
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1]
  start_date: '2019-01-01'
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 25
    dt: 1.0  # year
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: manual
    value: 50

economic:
  type: 'native'
  project_maturity: 'green_field'
  discount_rate: 0.095

# District heating configuration - using MILP optimizer
district_heating:
  feeding_time: 25.0
  coldstart_cost: 1000.0
  renewable_factor: 0.0
  must_run: 0.0
  ramping_cost: 0
  operation_year: 5
  run_district_heating_simulator: 'no'   # Disable HotmapsDispatch
  run_milp_optimizer: 'yes'              # Enable MILP optimizer
  efficiency_thermal: 0.9
  json_scenario_file: 'src/tango/addons/MILP/scenarios/geothermal_piecewise_5bp_inv.json'
  # json_scenario_file: 'src/tango/addons/MILP/scenarios/geothermal_piecewise_5bp.json'
  geothermal_max_capacity: 99.380536828358904          # Max capacity for geothermal investment (MW)

# Addon configuration
addons:
  ThermaGraph:
    active: 'no'
    execute: 'no'
    states_file: 'src/tango/states_test.json'
    connections_file: 'src/tango/connections_test.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: 'src/tango/results.csv'
  # MILP is integrated via district_heating.run_milp_optimizer, not as addon
  # MILP:
  #   active: 'no'
  #   execute: 'no'

# Power plant configuration for DH heat exchanger
power_plant_graph:
  nodes:
    inlet:
      type: 'Source'
      unit: 'native'
    outlet:
      type: 'Sink'
      unit: 'native'
    DH:
      type: 'SimpleHeatExchanger'
      unit: 'native'

  edges:
    1:
      source: 'inlet'
      target: 'DH'
    2:
      source: 'DH'
      target: 'outlet'

DH:
  Subtype: 'DH_component'
  T_out: 30

