#
# testcase6: AGS with CO2 (x1 horizontal well)
#

graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    h_well:
      type: 'horizontal_well'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_CPG'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'h_well'
    3:
      source: 'h_well'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'

# simulation input

runspec:
  title: 'AGS-CO2 1xHWELL'
  workflow: 'native' # type of physical system

props:
  fluid_name: 'CO2'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
  rock_k: 2.1  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.035  # degC/m

surface:
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

horizontal_well:
   wellhead_depth: 2500. # m
   well_length: 2500. # m
   diameter: 0.410 # m
   vertical_deviation: 90 # deg
   well_length_seq: [ 2500. ]
   well_diameter_seq: [ 0.410 ]

injection_well:
  well_length: 2500. # m
  diameter: 0.410 # m
  well_length_seq: [ 2500. ]
  well_diameter_seq: [ 0.410 ]

production_well:
  well_length: 2500. # m
  diameter: 0.410 # m
  well_length_seq: [ 2500. ]
  well_diameter_seq: [ 0.410 ]

functions:
  dts:
    type: segmented_linear
    time: [0, 5]
    dt: [1, 1 ]
    end_time: 5

costs:
  permitting:
    type: default_predefined
  exploration:
    type: default_predefined
  wells:
    type: default_predefined
  surface_pipes:
    type: default_predefined
  power_plant:
    type: default_predefined

schedule:
  bc_iteration_checkpoint: production_well_bottom
  mass_flow_rate: 5.0  # kg/s (injection rate per pattern)
  well_pattern: 'AGS'  # doublet, inverted_5spot, 5spot, AGS
  well_spacing: 2500. # m (inj-prod pair distance at surface)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  time:
    type: ConstantDT
    num_tsteps: 5 # number of time steps
    dt: 1.0  # time step increment (year)

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095
