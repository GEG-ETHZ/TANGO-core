#
# testcase1: CPG (Doublet, green_field)
#

runspec:
  title: 'CPG DOUBLET'
  workflow: 'native' # type of physical system





graph:
  nodes:
    # compute nodes. each consists of a unit and its state
    inj_1: # unique id
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_CPG'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'


# (potentially) an external file, sat testcase1_input.yml

props:
    fluid_name: 'CO2'
    brine_density: 1000.
    
reservoir:
    perm: 1e-14
    poro: 0.2
    solution:
      initialization:

surface:
    temp: 10
    
wells:
    diameter: 0.4

schedule:
  mass_flow_rate: 200.0  # kg/s (injection rate per pattern)
  well_pattern: 'DOUBLET' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 5 # number of time steps
  dt: 1.0  # time step increment (year)

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095



