#
# testcase8: AGS with CO2 (x2 horizontal well)
#

runspec:
  title: 'AGS-CO2 1xHWELL'
  workflow: 'native' # type of physical system

graph:
  specs: # common specs shared across graph (rock / fluid properties, initial condition, etc.)
    fluid_name: 'CO2'
    brine_density: 1000 # kg/m3
    rock_density: 2650.0 # kg/m3
    rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
    rock_k: 2.1  # thermal conductivity (W/(m*K))
    thermal_gradient: 0.035  # degC/m
    surface_temperature: 288.15  # K
    surface_pressure: 100_000  # Pa
  nodes:
    # compute nodes. each consists of a  and its state
    inj_1: # unique id
      type: 'injection_well'
      unit: 'native'
      specs:
        well_length: 2500. # m
        diameter: 0.410 # m
    h_well_1:
      type: 'horizontal_well'
      unit: 'native'
      specs:
        wellhead_depth: 2500. # m
        well_length: 707. # m
        diameter: 0.410 # m
        vertical_deviation: 90 # deg
    h_well_2:
      type: 'horizontal_well'
      unit: 'native'
      specs:
        wellhead_depth: 2500. # m
        well_length: 707. # m
        diameter: 0.410 # m
        vertical_deviation: 90 # deg
    prd_1:
      type: 'production_well'
      unit: 'native'
      specs:
        well_length: 2500. # m
        diameter: 0.410 # m
    surface:
      type: 'surface'
      unit: 'native_CPG'
      specs:
        pipe_diameter: 0.41 # m
        approach_temperature: 7.0  # K
        condensation_pressure_offset: 50_000.0  # Pa
        eta_turbine: 0.78  # (-)
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'h_well_1'
    3:
      source: 'inj_1'
      target: 'h_well_2'
    4:
      source: 'h_well_1'
      target: 'prd_1'
    5:
      source: 'h_well_2'
      target: 'prd_1'
    6:
      source: 'prd_1'
      target: 'surface'

schedule:
  mass_flow_rate: 5.0  # kg/s (injection rate per pattern)
  well_pattern: 'AGS' # doublet, inverted_5spot, 5spot
  well_spacing: 2500. # m (inj-prod pair distance at surface)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 5 # number of time steps
  dt: 1.0  # time step increment (year)

economic: # optional
  type: 'native'
  project_maturity: 'green_field' # brown_field or green_field
  discount_rate: 0.095



