common:
  fluid_name: 'CO2'
  mass_flow_rate: 10.0  # kg/s (per well pair)
  dt: 1.0  # year
  reservoir_depth: 2500.0 # m
  rock_density: 2650.0
  rock_cp: 1000.0  # J/kg K
  rock_k: 2.1  # W/m K
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  thermal_gradient: 0.035  # degC/m
  start_year: 2019
  lifetime: 25

reservoir:
  thickness: 100.0
  area: 250_000
  permeability: 5.0e-13    # m2
  porosity: 0.1
  inlet_temperature: 298.15   # K
  well_spacing: 707. # m
  well_pattern: 'INVERTED_5SPOT' # doublet, inverted_5spot
  num_patterns_sqrt: 1 # square root of number of 5 spots

injection_well:
  vertical_deviation: 0.0  # degrees
  diameter: 0.410  # m
  num_cells: 300
  epsilon: 55.e-6  # m
  gravity_scale_factor: 1.0

production_well:
  vertical_deviation: 0.0  # degrees
  diameter: 0.410  # m
  num_cells: 300
  epsilon: 55.e-6  # m
  gravity_scale_factor: 1.0

surface:
  ambient_temperature: 288.15  # K #TODO: check unit consistency
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

economic:
  project_maturity: 'green_field' # brown_field or green_field
  PPI_table: 'PPI_table.xlsx' # Optional




