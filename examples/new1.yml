#
# testcase3: CPG (x? Inverted 5spot, brown_field)
#

graph:
  nodes:
    inj_1: # root node
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    prd_1:
      type: 'production_well'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_CPG'
  edges:
    1:
      source: 'surface'
      target: 'inj_1'
    2:
      source: 'inj_1'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'prd_1'
    4:
      source: 'prd_1'
      target: 'surface'

# simulation input

runspec:
  title: 'CPG ?xINV5SPOT'
  workflow: 'native'

props:
  fluid_name: 'CO2'
  brine_density: 1000 # kg/m3
  rock_density: 2650.0 # kg/m3
  rock_cp: 1000.0  # # specific heat capacity (J/(kg*K))
  rock_k: 3.0  # thermal conductivity (W/(m*K))
  thermal_gradient: 0.026  # degC/m

surface:
  surface_temperature: 288.15  # K
  surface_pressure: 100_000  # Pa
  pipe_diameter: 0.41 # m
  approach_temperature: 7.0  # K
  condensation_pressure_offset: 50_000.0  # Pa
  eta_turbine: 0.78  # (-)

reservoir:
  reservoir_depth: 1720.0 # m
  thickness: 60.0 # m
  permeability: 1.0e-12    # m2 ~50mD
  porosity: 0.25

injection_well:
  well_length: 1720. # m
  diameter: 0.410 # m

production_well:
  well_length: 1720. # m
  diameter: 0.410 # m

schedule:
  mass_flow_rate: 40.0  # kg/s (injection rate per pattern)
  well_pattern: 'INVERTED_5SPOT' # doublet, inverted_5spot, 5spot
  well_spacing: 707. # m (inj-prod pair)
  well_pattern_dimens: [1,1] # [num_patterns_x_dir, num_patterns_y_dir]
  start_date: '2019-01-01' # Year-mm-dd
  num_tsteps: 100 # number of time steps
  dt: 1.0  # time step increment (year)

economic: # optional
  type: 'native'
  project_maturity: 'brown_field' # brown_field or green_field
  discount_rate: 0.095
