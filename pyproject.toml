[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tango"
version = "0.0.1"
authors = [{name = "ETHZ/EAPS/GEG Group"}]
description = "Techno-economic ANalysis of Geo-energy Operations (TANGO)"
readme = "README.md"
# license = { file = "LICENSE.md" }
requires-python = ">=3.10,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2.1,<3.0",
    "polars>=1.0,<2.0",
    "matplotlib",
    "scipy",
    # "scikit-learn>=1.6,<2.0", # not being used anywhere
    "seaborn",
    "openpyxl>=3.1,<4.0",
    "pyyaml>=6.0,<7.0", # needed for (de)serialization
    "sphinx>=7.4,<8.0",
    "joblib>=1.4,<2.0",
    "networkx>=3.1,<4.0",
    "jinja2>=3.1,<4.0",
    "pip>=23.2,<24.0",
    "tqdm>=4.66,<5.0",
    "furo>=2024.8,<2025.0",
    "oyaml>=1.0,<2.0",
    "tabulate>=0.8,<1.0",
    "termcolor>=2.5,<3.0",
    "sphinx-basic-ng>=1.0.0b2,<2.0",
    "sphinx-rtd-theme>=3.0,<4.0",
    "sphinxcontrib-applehelp>=2.0,<3.0",
    "sphinxcontrib-devhelp>=2.0,<3.0",
    "sphinxcontrib-htmlhelp>=2.1,<3.0",
    "sphinxcontrib-jquery>=4.1,<5.0",
    "sphinxcontrib-jsmath>=1.0,<2.0",
    "sphinxcontrib-qthelp>=2.0,<3.0",
    "sphinxcontrib-serializinghtml>=1.1,<2.0",
    "pexpect>=4.0,<5.0",
    "python-arango",
    "types-tqdm>=4.67.0.20250809,<5",
    "coolprop==6.8.0",
    "tespy==0.7.1.post1",
    "fluprodia>=3.5.1,<4",
    "pymoo==0.6.1.3",
    "types-pyyaml>=6.0.12.20250915",
    "dvc-webdav>=3.0.1",
    "dvc-gs>=3.0.2",
]

[project.urls]
Homepage = "https://tango.app/"

[project.scripts]
tango_cli = "tango.tango_cli:main"

[project.optional-dependencies]
dev = [
    "pylsp-mypy>=0.7.0", # provides connection from python LSP to mypy
    "pylsp-rope>=0.1.17", # provides linting tools
    "ruff>=0.11.9", # provides additional linting tools
    "pytest~=8.3", # for functional and unit testing
    "python-lsp-server~=1.10", # server
    "ipython >=8.37.0,<10", # handy for quick interpreter
    "pandas-stubs >=2.3.2.250926,<3", # stub files to provide pandas interface typing
    "types-pyyaml >=6.0.12.20250915,<7", # stub files to provide pyyaml interface typing
    "types-networkx >=3.5.0.20251104,<4", # stub files to provide networkx interface typing
    "ipykernel ~= 7.0",
    "dvc>=3.0,<4.0", # pipeline + experiment tracking
]
tango-app = [
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "gunicorn",
]

[dependency-groups]
dev = [
    "prek>=0.3.13", # git hook management
    "tango[dev]",
]
tango-app = ["tango[tango-app]"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = [
    "src/tango/",
] # package names should match these glob patterns (["*"] by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "win-64", "linux-64", "linux-aarch64"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
tango-app = { features = ["tango-app"], solve-group = "default" }

[tool.pixi.pypi-dependencies]
tango = { path = ".", editable = true }

[tool.pixi.tasks]
test = { cmd = "pixi run -e dev pytest" }
helix = { cmd = "pixi run -e dev hx ." }  # launch helix editor
fmt = "ruff format"
lint = "pylint"
style = { depends-on = ["fmt", "lint"] }

[tool.pixi.dependencies]

[tool.pixi.feature.tango-app.dependencies]
pyqt = "*"

[tool.uv]
# Common uv commands:
#   uv sync                          -- install base dependencies (editable)
#   uv sync --group dev              -- install + dev tools
#   uv sync --group tango-app        -- install + PyQt5 for GUI addons
#   uv run pytest        -- run tests
#   uv run --group tango-app python tango_flask_server.py
#   uv run ruff format .             -- format code
#   uv run ruff check .              -- lint code
# note that uv runs with `--group dev` implicitly

[tool.ruff]
# Specify Python version
target-version = "py311"
# Maximum line length
line-length = 110
# Exclude specific paths
exclude = [
    "site-packages" # Ignore all errors in site-packages
]

[tool.ruff.lint.isort]
known-first-party = ["tango"]
section-order = ["standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
    "A", # flake8-builtins
    "ARG", # flake8-unused-arguments
    # "B", # flake8-bugbear
    "C", # Pylint: Convention
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "COM", # flake8-commas
    "D", # pydocstyle
    "E", # Error
    "F", # Pyflakes
    "G", # flake8-logging-format
    "I", # isort
    "LOG", # flake8-logging
    "N", # pep8-naming
    "NPY", # numpy-specific
    "PERF", # Perflint
    # "PL", # Pylint
    "Q", # flake8-quotes
    "SIM", # flake8-simplify
    # "TID", # flake8-tidy-imports (absolute imports)
    "UP", # pyupgrade
    "W" # Warning
]
ignore = [
    "D400", # first-line-should-end-with-a-period
    "D415", # first-line-should-end-with-a-period
    "E266", # Too many leading `#`
    "SIM108",
    "SIM118",  # allow `.keys()`
    "D205", # blank line after summary
    "C901", # name is too complex
    "PERF401", # Use `list.extend` to transform list
    "LOG015", # `info()` call on root logger
    "N807",
    "G004", # log statement uses f-string
    "N803", # allow upper case variable names
    "G003", # logging uses `+`
    "N807",
]

# [tool.ruff.lint.pydocstyle]
# convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#example-pyproject-toml
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
allow_redefinition = true
exclude = [
    # '^file1\.py$',  # TOML literal string (single-quotes, no escaping necessary)
    # "^file2\\.py$",  # TOML basic string (double-quotes, backslash and other characters need escaping)
]

# mypy per-module options:

# [[tool.mypy.overrides]]
# module = "mycode.foo.*"
# disallow_untyped_defs = true

# [[tool.mypy.overrides]]
# module = "mycode.bar"
# warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "pymoo.*",
    "tango.*", # TODO: fix tango and remove this line
    "CoolProp",
]
ignore_missing_imports = true
