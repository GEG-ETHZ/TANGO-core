[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
# The distribution `tango-core`, the import package `tango_core`
# (src/tango_core/), and the `tango_core` command share one name. PyPI
# already has an unrelated package called `tango`.
name = "tango-core"
version = "1.2.0"
authors = [{name = "Geothermal Energy and Geofluids Group, ETH Zurich", email = "chad.baker@eaps.ethz.ch"}]
maintainers = [{name = "Chad Baker", email = "chad.baker@eaps.ethz.ch"}]
description = "Techno-economic ANalysis of Geoenergy Operations (TANGO)"
dynamic = ["readme"]  # README.md with absolute links for PyPI; see [tool.hatch.metadata.hooks.fancy-pypi-readme]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy<2.5", # pymoo 0.6.1.3 calls numpy.row_stack, which numpy 2.5 removed
    "matplotlib>=3.10,<4.0",
    "scipy>=1.15,<2.0",
    "scikit-learn>=1.6,<2.0", # random-forest surrogate models for opt_* apps (surrogate_api.py)
    "pyyaml>=6.0,<7.0", # needed for (de)serialization
    "joblib>=1.4,<2.0",
    "coolprop==6.8.0",
    "tespy==0.11.2",
    "pydantic>=2.0,<3.0",
    "pymoo==0.6.1.3",
    "plotly>=5.24,<6.0", # interactive parallel-coordinates plots for parameter sweeps;
                          # interactive P-h phase diagrams from `tango_core run --save-dir`
]

[project.urls]
Homepage = "https://github.com/GEG-ETHZ/TANGO-core"

[project.scripts]
tango_core = "tango_core.cli:main"

[dependency-groups]
# Tools for working on the repository, never published; `uv sync` installs
# this group by default.
dev = [
    "prek>=0.3.13", # git hook management
    "pytest-xdist>=3.8.0",
    "pylsp-mypy>=0.7.0", # provides connection from python LSP to mypy
    "pylsp-rope>=0.1.17", # provides linting tools
    "ruff>=0.11.9", # provides additional linting tools
    "pytest~=8.3", # for functional and unit testing
    "python-lsp-server~=1.10", # server
    "ipython >=8.37.0,<10", # handy for quick interpreter
    "pandas-stubs >=2.3.2.250926,<3", # stub files to provide pandas interface typing
    "types-pyyaml >=6.0.12.20250915,<7", # stub files to provide pyyaml interface typing
    "types-networkx >=3.5.0.20251104,<4", # stub files to provide networkx interface typing
    "ipykernel ~= 7.0",
    "dvc>=3.0,<4.0", # pipeline + experiment tracking
    "dvc-gs>=3.0.2", # DVC remote on Google Cloud Storage
    "dvc-webdav>=3.0.1", # DVC remote over WebDAV
    "sphinx>=7.4,<8.0", # for generating documentation from inline doc strings
    "snakeviz>=2.2,<3.0", # cProfile visualisation (tools/run_tango_profile.py --profile)
]
# RAFT (GEG-ETHZ/RAFT): FEM wellbore + rock heat simulator behind the
# `grouped_subsurface` component's `raft` variant, installed with
# `uv sync --group raft`. A dependency group rather than an extra, so it stays
# out of the published package until RAFT's PyPI name is settled. The source
# is pinned in [tool.uv.sources] below.
raft = ["geg-raft"]
docs = [
    "zensical==0.0.68", # docs site generator (reads mkdocs.yml); `uv run --group docs zensical serve`
    "mkdocstrings-python==2.0.9", # API reference pages from the Google-style docstrings
]

# PyPI shows README.md as the project page but can't resolve relative paths,
# so the copy in the package metadata points them at GitHub: images at the
# raw files, links at the rendered pages. The README in the repository keeps
# its relative paths, which work on GitHub in every branch and fork.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# images: Markdown ![..](path) and HTML src= / srcset=
pattern = '(\]\(|src="|srcset=")(?:\./)?(?!https?://|#|mailto:)([^)"]+\.(?:svg|png|jpg|jpeg|gif))'
replacement = '\1https://raw.githubusercontent.com/GEG-ETHZ/TANGO-core/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# every other relative Markdown link
pattern = '\]\((?:\./)?(?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/GEG-ETHZ/TANGO-core/blob/main/\1)'

# The sdist holds the package's source, its tests, and what the wheel is built
# from; `uv build` makes the wheel from the sdist, so a path the wheel's
# force-include needs must be listed here or the build fails. Everything else
# in the repository (internal docs, agent and editor config, tooling, CI) stays
# out of the published release. pyproject.toml is always included.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/templates",
    "/applications",
    "/docs/SOURCES.md",
    "/README.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE.txt",
    "/LICENSES",
    "/REUSE.toml",
    "/pytest.ini",
]
# What the wheel's force-include leaves out of applications/ stays out of the
# sdist too: the on-hold app and the DVC locks of this repository's own runs.
exclude = [
    "/applications/_on_hold",
    "**/dvc.lock",
    "**/REDESIGN_TODO.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tango_core"]

[tool.hatch.build.targets.wheel.force-include]
# templates/ lives at the repo root (used directly by tests/dvc/justfile
# via that path) rather than under src/tango_core/ -- force-include ships it in
# the wheel at tango_core/templates/ (see tango_core init) without moving or
# duplicating it, so nothing referencing the top-level path needs to change.
# Files are listed individually, as for applications/ below. Every template
# ships, the RAFT example (AGS_ORC_electric_raft.yml and templates/raft/)
# included, so `tango_core init` copies a runnable RAFT case; RAFT itself is
# installed separately (docs/guides/install.md). tests/unit/test_packaging.py
# fails until this list matches `git ls-files templates/`.
"templates/.gitignore" = "tango_core/templates/.gitignore"
"templates/AGS_ORC_electric.yml" = "tango_core/templates/AGS_ORC_electric.yml"
"templates/AGS_ORC_electric_grouped_subsurface.yml" = "tango_core/templates/AGS_ORC_electric_grouped_subsurface.yml"
"templates/AGS_ORC_electric_raft.yml" = "tango_core/templates/AGS_ORC_electric_raft.yml"
"templates/AGS_direct_heat.yml" = "tango_core/templates/AGS_direct_heat.yml"
"templates/CO2_AGS_ORC_electric.yml" = "tango_core/templates/CO2_AGS_ORC_electric.yml"
"templates/CO2_AGS_direct_heat.yml" = "tango_core/templates/CO2_AGS_direct_heat.yml"
"templates/CO2_AGS_electric.yml" = "tango_core/templates/CO2_AGS_electric.yml"
"templates/CO2_EGS_ORC_electric.yml" = "tango_core/templates/CO2_EGS_ORC_electric.yml"
"templates/CO2_EGS_direct_heat.yml" = "tango_core/templates/CO2_EGS_direct_heat.yml"
"templates/CO2_EGS_electric.yml" = "tango_core/templates/CO2_EGS_electric.yml"
"templates/CPG_direct_heat.yml" = "tango_core/templates/CPG_direct_heat.yml"
"templates/CPG_electric.yml" = "tango_core/templates/CPG_electric.yml"
"templates/EGS_direct_heat.yml" = "tango_core/templates/EGS_direct_heat.yml"
"templates/EGS_electric.yml" = "tango_core/templates/EGS_electric.yml"
"templates/README.md" = "tango_core/templates/README.md"
"templates/hydro_ORC_electric.yml" = "tango_core/templates/hydro_ORC_electric.yml"
"templates/hydro_df_electric.yml" = "tango_core/templates/hydro_df_electric.yml"
"templates/hydro_direct_heat.yml" = "tango_core/templates/hydro_direct_heat.yml"
"templates/hydro_sf_electric.yml" = "tango_core/templates/hydro_sf_electric.yml"
"templates/hydro_sf_electric_5spot.yml" = "tango_core/templates/hydro_sf_electric_5spot.yml"
"templates/raft/AGS_single.geo" = "tango_core/templates/raft/AGS_single.geo"
"templates/raft/AGS_single.msh" = "tango_core/templates/raft/AGS_single.msh"
"templates/raft/config_example_AGS_coupled_single.yaml" = "tango_core/templates/raft/config_example_AGS_coupled_single.yaml"

# User-facing docs from docs/. Files are listed individually, not the whole
# directory: docs/ also holds the developer docs (task log, roadmap, design
# notes, archive), which are not shipped, and force-include copies whatever
# is on disk rather than only git-tracked files.
"docs/SOURCES.md" = "tango_core/docs/SOURCES.md"

# applications/<app>/ files, explicitly enumerated rather than
# force-including the whole applications/ directory -- app dirs
# accumulate untracked local run cruft (outputs/*.csv, __pycache__,
# SLURM *.err/*.out logs) that force-include would otherwise copy
# verbatim from whatever happens to be on disk at build time (it is NOT
# git-tracked-file-aware). This list should track `git ls-files
# applications/`, minus dvc.lock (stale/misleading outside this repo's
# own runs), outputs/.gitignore (placeholder, not needed in a fresh
# copy), REDESIGN_TODO.md (internal planning note, not user-facing), and
# applications/README.md (describes the whole directory, not one app --
# not copied per-app by `tango_core init --app`). Regenerate by re-running
# that command and re-applying this same filter if apps are added,
# renamed, or gain/lose files; tests/unit/test_packaging.py fails until
# the list matches.
"applications/demo_hydro_sf_electric/.gitignore" = "tango_core/applications/demo_hydro_sf_electric/.gitignore"
"applications/demo_hydro_sf_electric/demo_hydro_sf_electric.py" = "tango_core/applications/demo_hydro_sf_electric/demo_hydro_sf_electric.py"
