[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name deliberately differs from the importable module
# (src/tango/, `import tango`) -- PyPI already has an unrelated package
# literally named `tango`. This repo isn't published there today, but
# `tango-core` avoids a headache if that ever changes, while keeping the
# short `import tango` for everyday use. Common pattern (see e.g.
# beautifulsoup4 -> bs4, scikit-learn -> sklearn, pyyaml -> yaml).
name = "tango-core"
version = "1.1.0"
authors = [{name = "ETHZ/EAPS/GEG Group"}]
description = "Techno-economic ANalysis of Geo-energy Operations (TANGO)"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2.1,<3.0",
    "polars>=1.0,<2.0",
    "matplotlib>=3.10,<4.0",
    "scipy>=1.15,<2.0",
    "scikit-learn>=1.6,<2.0", # random-forest surrogate models for opt_* apps (surrogate_api.py)
    "seaborn>=0.13,<1.0",
    "openpyxl>=3.1,<4.0",
    "pyyaml>=6.0,<7.0", # needed for (de)serialization
    "joblib>=1.4,<2.0",
    "networkx>=3.1,<4.0",
    "jinja2>=3.1,<4.0",
    "pip>=23.2,<24.0",
    "tqdm>=4.66,<5.0",
    "oyaml>=1.0,<2.0",
    "tabulate>=0.8,<1.0",
    "termcolor>=2.5,<3.0",
    "pexpect>=4.0,<5.0",
    "python-arango",
    "types-tqdm>=4.67.0.20250809,<5",
    "coolprop==6.8.0",
    "tespy==0.11.2",
    "pydantic>=2.0,<3.0",
    "msgpack>=1.0,<2.0",
    "fluprodia>=4.1.2,<5",
    "pymoo==0.6.1.3",
    "types-pyyaml>=6.0.12.20250915",
    "dvc-webdav>=3.0.1",
    "dvc-gs>=3.0.2",
    "plotly>=5.24,<6.0", # interactive parallel-coordinates plots for parameter sweeps;
                          # interactive P-h phase diagrams from `tango_cli run --save-dir`
]

[project.urls]
Homepage = "https://tango.app/"

[project.scripts]
tango_cli = "tango.tango_cli:main"

[project.optional-dependencies]
# RAFT (GEG-ETHZ/RAFT): FEM wellbore + rock heat simulator behind the
# `closed_loop` component's `raft` variant. Optional: `uv sync --extra raft`.
# The source is pinned in [tool.uv.sources] below. The name `raft` on PyPI
# is an unrelated package, so install through uv, not plain pip.
raft = ["raft"]
dev = [
    "pylsp-mypy>=0.7.0", # provides connection from python LSP to mypy
    "pylsp-rope>=0.1.17", # provides linting tools
    "ruff>=0.11.9", # provides additional linting tools
    "pytest~=8.3", # for functional and unit testing
    "python-lsp-server~=1.10", # server
    "ipython >=8.37.0,<10", # handy for quick interpreter
    "pandas-stubs >=2.3.2.250926,<3", # stub files to provide pandas interface typing
    "types-pyyaml >=6.0.12.20250915,<7", # stub files to provide pyyaml interface typing
    "types-networkx >=3.5.0.20251104,<4", # stub files to provide networkx interface typing
    "ipykernel ~= 7.0",
    "dvc>=3.0,<4.0", # pipeline + experiment tracking
    "sphinx>=7.4,<8.0", # for generating documentation from inline doc strings
    "snakeviz>=2.2,<3.0", # cProfile visualisation (tools/run_tango_profile.py --profile)
]

[dependency-groups]
dev = [
    "prek>=0.3.13", # git hook management
    "pytest-xdist>=3.8.0",
    "tango-core[dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tango"]

[tool.hatch.build.targets.wheel.force-include]
# example_configs/ lives at the repo root (used directly by tests/dvc/justfile
# via that path) rather than under src/tango/ -- force-include ships it in
# the wheel at tango/example_configs/ (see tango_cli init) without moving or
# duplicating it, so nothing referencing the top-level path needs to change.
"example_configs" = "tango/example_configs"

# User-facing docs (docs/; developer docs live in dev_docs/ and are not
# shipped). Files are listed individually, not the whole directory, for the
# same reason as applications/ below: force-include copies whatever is on
# disk, and docs/ will also hold Sphinx build output (docs/_build, docs/api).
"docs/SOURCES.md" = "tango/docs/SOURCES.md"

# applications/<app>/ files, explicitly enumerated rather than
# force-including the whole applications/ directory -- app dirs
# accumulate untracked local run cruft (outputs/*.csv, __pycache__,
# SLURM *.err/*.out logs) that force-include would otherwise copy
# verbatim from whatever happens to be on disk at build time (it is NOT
# git-tracked-file-aware). This list should track `git ls-files
# applications/`, minus dvc.lock (stale/misleading outside this repo's
# own runs), outputs/.gitignore (placeholder, not needed in a fresh
# copy), REDESIGN_TODO.md (internal planning note, not user-facing), and
# applications/README.md (describes the whole directory, not one app --
# not copied per-app by `tango_cli init --app`). Regenerate by re-running
# that command and re-applying this same filter if apps are added,
# renamed, or gain/lose files.
"applications/demo_hydro_sf_electric/.gitignore" = "tango/applications/demo_hydro_sf_electric/.gitignore"
"applications/demo_hydro_sf_electric/demo_hydro_sf_electric.py" = "tango/applications/demo_hydro_sf_electric/demo_hydro_sf_electric.py"
"applications/demo_well_mesh_convergence/demo_well_mesh_convergence.py" = "tango/applications/demo_well_mesh_convergence/demo_well_mesh_convergence.py"
