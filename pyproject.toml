[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "win-64", "linux-64", "linux-aarch64"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.pypi-dependencies]
tango-core = { path = ".", editable = true }

[tool.pixi.tasks]
test = { cmd = "pixi run -e dev pytest" }
helix = { cmd = "pixi run -e dev hx ." }  # launch helix editor
fmt = "ruff format"
lint = "pylint"
style = { depends-on = ["fmt", "lint"] }

[tool.pixi.dependencies]

[tool.uv.sources]
# Pinned to a release tag (uv.lock records its commit); bump deliberately.
# RAFT is public on GitHub but not on PyPI, so it is a git source here and
# can't be a dependency of the published package. `uv sync --locked` without
# the `raft` group never fetches it.
geg-raft = { git = "https://github.com/GEG-ETHZ/RAFT.git", tag = "v0.2.1" }

[tool.uv]
# Common uv commands:
#   uv sync                          -- install base dependencies (editable)
#   uv sync --group dev              -- install + dev tools
#   uv run pytest        -- run tests
#   uv run ruff format .             -- format code
#   uv run ruff check .              -- lint code
# note that uv runs with `--group dev` implicitly

[tool.ruff]
# Specify Python version
target-version = "py311"
# Maximum line length
line-length = 110
# Exclude specific paths
exclude = [
    "site-packages" # Ignore all errors in site-packages
]

[tool.ruff.lint.isort]
known-first-party = ["tango_core"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
    "A", # flake8-builtins
    "ARG", # flake8-unused-arguments
    # "B", # flake8-bugbear
    "C", # Pylint: Convention
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "COM", # flake8-commas
    "D", # pydocstyle
    "E", # Error
    "F", # Pyflakes
    "G", # flake8-logging-format
    "I", # isort
    "LOG", # flake8-logging
    "N", # pep8-naming
    "NPY", # numpy-specific
    "PERF", # Perflint
    # "PL", # Pylint
    "Q", # flake8-quotes
    "SIM", # flake8-simplify
    # "TID", # flake8-tidy-imports (absolute imports)
    "UP", # pyupgrade
    "W" # Warning
]
ignore = [
    # TODO: legacy errors inherited from pre-cleanup codebase — remove during overhaul
    "D401",   # imperative-mood docstrings (429 instances)
    "N806",   # variable in function should be lowercase (378 instances)
    "E501",   # line too long (129 instances)
    "D100",   # missing docstring in public module (60 instances)
    "N802",   # function name should be lowercase (57 instances)
    "F405",   # may be undefined from star import (38 instances)
    "ARG002", # unused method argument (24 instances)
    "N816",   # mixed-case variable in global scope (18 instances)
    "F403",   # star import used (18 instances)
    "ARG005", # unused lambda argument (10 instances)
    "A002",   # argument shadows builtin (10 instances)
    "N999",   # invalid module name (9 instances)
    "A001",   # variable shadows builtin (8 instances)
    "E722",   # bare except (7 instances)
    "E402",   # module level import not at top of file (6 instances)
    "N801",   # class name should use CapWords (2 instances — Analyzer_addon, ThermaGraph_addon)
    "N817",   # CamelCase imported as acronym — CoolProp as CP (3 instances)
    "SIM102", # nested if statements (5 instances)
    "SIM113", # use enumerate() (1 instance)
    "SIM116", # use dict instead of consecutive if/elif (1 instance)
    "PERF402", # use list.copy (1 instance)
    "ARG001", # unused function argument (3 instances)
    "D404",   # docstring starts with "This" (2 instances)
    "D420",   # docstring section order (2 instances)
    "D414",   # empty docstring section (1 instance)
    # end legacy suppressions
    "D400", # first-line-should-end-with-a-period
    "D415", # first-line-should-end-with-a-period
    "E266", # Too many leading `#`
    "SIM108",
    "SIM118",  # allow `.keys()`
    "D205", # blank line after summary
    "C901", # name is too complex
    "PERF401", # Use `list.extend` to transform list
    "LOG015", # `info()` call on root logger
    "N807",
    "G004", # log statement uses f-string
    "N803", # allow upper case variable names
    "G003", # logging uses `+`
    "N807",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#example-pyproject-toml
[tool.mypy]
python_version = "3.12"
strict = true
allow_redefinition = true

# mypy per-module options:

# [[tool.mypy.overrides]]
# module = "mycode.foo.*"
# disallow_untyped_defs = true

# [[tool.mypy.overrides]]
# module = "mycode.bar"
# warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "pymoo.*",
    "CoolProp",
    "tespy.*",
    "joblib",
    "scipy.spatial",
    "scipy.stats",
    "sklearn.*",
    "plotly.*",
    "geg_raft.*",  # optional `raft` group; absent in a plain `uv sync`
]
ignore_missing_imports = true

# The one deliberate relaxation of `strict = true` for tango_core's own code.
[[tool.mypy.overrides]]
module = "tango_core.*"
warn_return_any = false  # untyped third-party deps (CoolProp, numpy/pandas in some contexts) return Any; suppress that cascade rather than the module's own typing

# pymoo ships no type information, so its base classes (ElementwiseProblem,
# Output, DuplicateElimination) are `Any`; subclassing them is unavoidable in
# the pymoo adapters.
[[tool.mypy.overrides]]
module = ["tango_core.pymoo_api", "tango_core.surrogate_api"]
disallow_subclassing_any = false
