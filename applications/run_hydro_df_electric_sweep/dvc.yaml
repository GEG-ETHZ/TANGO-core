stages:

  # Stage 1: generate the design matrix (one-at-a-time low/high builder
  # lives here — no params.yaml entries, the design is fixed by
  # common.py's PARAMETER_BOUNDS, not a tunable sample count).
  generate:
    cmd: python generate.py
    deps:
      - generate.py
      - common.py
      - ../../example_configs/hydro_df_electric.yml
    outs:
      - outputs/design_matrix.parquet

  # Stage 2: run all simulations in parallel (checkpoint/resume built in).
  sweep:
    cmd: python sweep.py
    deps:
      - sweep.py
      - common.py
      - ../../example_configs/hydro_df_electric.yml
      - outputs/design_matrix.parquet
      # Content hash of src/tango/, kept current by the hash-tango
      # pre-commit hook (tools/hash_tango.py). Tracking this one small
      # file instead of the whole src/tango/ tree directly means DVC
      # doesn't have to hash hundreds of source files on every `dvc repro`.
      - ../../src/tango.hash
    params:
      - params.yaml:
          - log_level
    outs:
      - outputs/results

  # Clean up any leftover .tmp files from atomic writes interrupted mid-run.
  clean:
    cmd: python -c "import pathlib; [f.unlink() for f in pathlib.Path('outputs/results').glob('*.tmp')]"
    deps:
      - outputs/results

  # Stage 3: aggregate JSONs → parquet, compute summary metrics + the
  # per-parameter sensitivity table.
  summarize:
    cmd: python summarize.py
    deps:
      - summarize.py
      - common.py
      - outputs/results
    outs:
      - outputs/results.parquet
      - outputs/sensitivity_table.csv
    metrics:
      - outputs/summary.yaml:
          cache: true

  # Stage 4: per-parameter sensitivity ("tornado") chart — the visual
  # companion to outputs/sensitivity_table.csv (see plot.py's module
  # docstring for why this design gets a tornado chart, not the AGS/EGS
  # sweeps' parallel-coordinates / success-scatter grid).
  plot:
    cmd: python plot.py
    deps:
      - plot.py
      - common.py
      - outputs/results.parquet
    outs:
      - outputs/tornado.png
