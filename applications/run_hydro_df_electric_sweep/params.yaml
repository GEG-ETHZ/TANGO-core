# Parameters for the tango hydro_df_electric one-at-a-time (OFAT)
# sensitivity sweep.
# Changing any value here marks the dependent DVC stage as stale.
# Run `dvc repro` from the repo root to re-execute stale stages.
#
# The design itself (which parameters are varied, and their low/high
# bounds) is NOT parameterized here — it's fixed by PARAMETER_BOUNDS in
# common.py and built by generate.py's OFAT design, changed by editing
# those files directly (which already invalidates generate.py's dvc.yaml
# deps). Unlike the AGS/EGS sweeps' full-factorial grid, sample count
# isn't a tunable knob here: OFAT always runs exactly (2 * n_params + 1)
# design points regardless of any value here.

n_workers: 45
log_level: NONE
