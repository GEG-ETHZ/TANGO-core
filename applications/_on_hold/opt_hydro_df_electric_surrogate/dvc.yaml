stages:

  # Stage 1 (redesigned 2026-09-03 -- see REDESIGN_TODO.md): a real NSGA2
  # search, run for a small fixed number of generations, retaining EVERY
  # evaluated individual (not just the final front) as training data.
  # Replaces the old lhs_generate/lhs_sweep pair -- see run_trajectory.py's
  # docstring for why.
  run_trajectory:
    cmd: python run_trajectory.py
    deps:
      - run_trajectory.py
      - common.py
      - ../../opt_hydro_df_electric/opt_hydro_df_electric.py
      - ../../../templates/hydro_df_electric.yml
      # Content hash of src/tango_core/, kept current by the hash-tango
      # pre-commit hook (tools/hash_tango.py).
      - ../../../src/tango_core.hash
    params:
      # n_train_workers deliberately excluded -- parallelism, not a
      # result-affecting param.
      - params.yaml:
          - trajectory_pop_size
          - trajectory_n_gen
          - trajectory_seed
          - trajectory_dedup_tol_frac
    outs:
      - outputs/lhs_training_data.csv
      - outputs/trajectory_pareto_results.csv

  # Stage 2: fit the surrogate (one swappable regressor per objective, plus
  # a feasibility classifier -- see train_surrogate.py's docstring for why
  # the classifier exists, and surrogate_api.REGRESSOR_FACTORIES for the
  # regressor choices).
  train_surrogate:
    cmd: python train_surrogate.py
    deps:
      - train_surrogate.py
      - common.py
      - outputs/lhs_training_data.csv
      # Content hash of src/tango_core/, kept current by the hash-tango
      # pre-commit hook (tools/hash_tango.py) -- without this, a change
      # to surrogate_api.py itself (e.g. the regressor/y-scaling logic) isn't
      # tracked at all, and dvc repro silently skips this stage as
      # unchanged. Confirmed the hard way (2026-09-01): the y_scaler fix and
      # stale-cache fix both landed in surrogate_api.py, but two consecutive
      # Euler runs kept reusing the pre-fix surrogate_model.joblib because
      # this dependency was missing.
      - ../../../src/tango_core.hash
    params:
      - params.yaml:
          - regressor
          - gpr_n_restarts_optimizer
          - regressor_rf_n_estimators
          - mlp_hidden_layer_sizes
          - mlp_alpha
          - mlp_max_iter
          - classifier_n_estimators
          - cv_folds
          - surrogate_seed
          - classifier_threshold
    outs:
      - outputs/surrogate_model.joblib
      - outputs/surrogate_diagnostics.csv
      - outputs/surrogate_classifier_diagnostics.csv

  # Stage 3: NSGA2 against the trained surrogate. Own GA config now
  # (n_max_gen/pop_size/ftol/xtol/optimize_seed are set, not commented out,
  # in THIS app's params.yaml as of 2026-09-03 -- see that file's comment
  # for why the old "mirror the real app's config for a timing comparison"
  # rationale no longer applies), so these ARE tracked via `params:` like
  # every other stage now, instead of the whole-file dep this used when the
  # keys could be absent.
  optimize_surrogate:
    cmd: python optimize_surrogate.py
    deps:
      - optimize_surrogate.py
      - common.py
      - outputs/surrogate_model.joblib
    params:
      - params.yaml:
          - n_max_gen
          - pop_size
          - ftol
          - xtol
          - optimize_seed
    outs:
      - outputs/surrogate_pareto_results.csv
      - outputs/pareto_parallel_coordinates.png
      - outputs/pareto_parallel_coordinates.html
      - outputs/pareto_scatter.png
      - outputs/pareto_scatter_normalized.png
      - outputs/pareto_scatter_by_param.png
      - outputs/pareto_scatter_param_pairs.png

  # Stage 4: re-run the real simulation on every surrogate pareto design;
  # fails the pipeline if any objective is off by more than
  # validation_tolerance for any design.
  validate_surrogate:
    cmd: python validate_surrogate.py
    deps:
      - validate_surrogate.py
      - common.py
      - ../../opt_hydro_df_electric/opt_hydro_df_electric.py
      - outputs/surrogate_pareto_results.csv
    params:
      - params.yaml:
          - validation_tolerance
    outs:
      - outputs/surrogate_validation.csv
      # The genuinely trustworthy result: real-feasible designs only, REAL
      # simulated objective values, non-dominance re-derived from those real
      # values -- see surrogate_api.corrected_pareto_front's docstring.
      # outputs/corrected/ (its plots) is NOT tracked here -- it's only
      # written when the corrected front is non-empty and --no-plot isn't
      # passed, and DVC `outs:` expects a declared path to always exist
      # after the stage runs.
      - outputs/corrected_pareto_results.csv
