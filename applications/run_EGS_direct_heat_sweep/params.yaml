# Parameters for the tango Triemli EGS direct-heat sweep.
# Changing any value here marks the dependent DVC stage as stale.
# Run `dvc repro` from the repo root to re-execute stale stages.
#
# The design grid itself (well depth / mass flow) is NOT parameterized here —
# it's a fixed full-factorial grid defined in common.py, changed by editing
# that file directly (which already invalidates generate.py's dvc.yaml deps).

n_workers: 45
log_level: NONE
