# Triemli (Zurich) direct-heat doublet — base configuration for parameter sweep.
#
# Site parameters from MS student request (2026-06-19):
#   surface temperature : 11 °C  (284.15 K)
#   thermal gradient    : 35 °C/km  (0.035 K/m)
#   fluid               : H2O
#   application         : direct heat only (no electricity)
#   return temperature  : 50 °C (district-heating return)
#
# The sweep varies:
#   reservoir_depth     : 2000 – 6000 m  (10 values)
#   mass_flow_rate      : 5   – 80 kg/s  (10 values)
#
# At 35 °C/km, 105 °C at the wellhead requires roughly 2700 m depth
# (accounting for heat loss in the production well).

graph:
  nodes:
    injection_well:
      type: 'injection_well'
      unit: 'native'
    reservoir:
      type: 'reservoir'
      unit: 'native'
    production_well_lower:
      type: 'production_well'
      unit: 'native'
    production_well_upper:
      type: 'production_well_pump'
      unit: 'native'
    surface:
      type: 'surface'
      unit: 'native_flexible'
  edges:
    1:
      source: 'surface'
      target: 'injection_well'
    2:
      source: 'injection_well'
      target: 'reservoir'
    3:
      source: 'reservoir'
      target: 'production_well_lower'
    4:
      source: 'production_well_lower'
      target: 'production_well_upper'
    5:
      source: 'production_well_upper'
      target: 'surface'

runspec:
  title: 'Triemli direct-heat doublet sweep'
  workflow: 'native'

props:
  fluid_name: 'H2O'
  brine_density: 1000       # kg/m³
  rock_density: 2650.0      # kg/m³
  rock_cp: 1000.0           # J/(kg·K)
  rock_k: 2.1               # W/(m·K)  — typical crystalline basement
  thermal_gradient: 0.035   # K/m  (35 °C/km, Triemli site)

surface:
  surface_temperature: 284.15   # K  (11 °C, Triemli)
  surface_pressure: 100_000     # Pa
  pipe_diameter: 0.41           # m
  approach_temperature: 7.0     # K
  target_extraction_pressure: 7_000_000  # Pa — pump delivers to 7 MPa at wellhead

reservoir:
  reservoir_depth: 3000.0       # m  — swept in the script
  thickness: 300.0              # m
  permeability: 1.0e-13         # m²  (~100 mD — moderate EGS)
  porosity: 0.1
  hydro_static_pressure: 29_430_000  # Pa  = 1000*9.81*3000 — updated per depth in script
  over_pressure_percentage: 5

injection_well:
  well_length: 3000.          # m  — updated per depth in script
  diameter: 0.311             # m  (~12-inch casing, typical for EGS)
  well_length_seq: [3000.]
  well_diameter_seq: [0.311]
  epsilon: 5.5e-5             # m  (smooth steel pipe)

production_well:
  well_length: 2400.          # m  = 0.8 × reservoir_depth — updated per depth
  diameter: 0.311             # m
  well_length_seq: [2400.]
  well_diameter_seq: [0.311]
  epsilon: 5.5e-5

production_well_pump:
  well_length: 600.           # m  = 0.2 × reservoir_depth — updated per depth
  diameter: 0.311             # m
  eta_pump: 0.75              # pump efficiency
  epsilon: 5.5e-5

costs:
  permitting:
    type: default
  exploration:
    type: default
  wells:
    type: default
  surface_pipes:
    type: default
  power_plant:
    type: default
    sizing_strategy: average_performance

schedule:
  main_product: 'heat'         # direct-heat mode — economic model uses thermal power
  electricity_price: 0.25      # CHF/kWh — used as by-product credit if any
  bc_iteration_checkpoint: injection_well_bottom
  mass_flow_rate: 30.          # kg/s — swept in the script
  well_pattern: 'DOUBLET'
  well_spacing: 500.           # m  — typical for EGS doublet
  well_pattern_dimens: [1, 1]
  start_date: '2024-01-01'
  num_pp: 1
  time:
    type: ConstantDT
    num_tsteps: 25             # 25 years of operation
    dt: 1.0                    # year
  bc_iteration:
    check_fracing: yes
    max_mass_rate: 150
  mass_rate:
    type: manual
    value: 30.                 # kg/s — kept in sync with mass_flow_rate in script

economic:
  type: 'native'
  project_maturity: 'green_field'
  discount_rate: 0.095

addons:
  ThermaGraph:
    active: 'no'
    execute: 'no'
    states_file: 'thermagraph_states.json'
    connections_file: 'thermagraph_connections.json'
  Analyzer:
    active: 'no'
    execute: 'no'
    results_file: 'analyzer_results.csv'

# Simple direct-heat surface plant: fluid passes through a district-heating
# heat exchanger and returns at 50 °C (= injection temperature).
power_plant_graph:
  nodes:
    inlet:
      type: 'Source'
      unit: 'native'
    DH:
      type: 'SimpleHeatExchanger'
      unit: 'native'
    outlet:
      type: 'Sink'
      unit: 'native'
  edges:
    1:
      source: 'inlet'
      target: 'DH'
    2:
      source: 'DH'
      target: 'outlet'

DH:
  Subtype: 'DH_component'
  T_out: 50      # °C — district-heating return temperature (injection temperature)
