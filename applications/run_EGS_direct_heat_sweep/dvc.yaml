stages:

  # Stage 1: generate the full-factorial design matrix (depth × mass-flow —
  # see common.py for the grid axes).
  generate:
    cmd: python generate.py
    deps:
      - generate.py
      - common.py
      - ../../templates/EGS_direct_heat.yml
    outs:
      - outputs/design_matrix.parquet

  # Stage 2: run all simulations in parallel (checkpoint/resume built in).
  sweep:
    cmd: python sweep.py
    deps:
      - sweep.py
      - common.py
      - ../../templates/EGS_direct_heat.yml
      - outputs/design_matrix.parquet
      # Content hash of src/tango/, kept current by the hash-tango
      # pre-commit hook (tools/hash_tango.py). Tracking this one small
      # file instead of the whole src/tango/ tree directly means DVC
      # doesn't have to hash hundreds of source files on every `dvc repro`.
      - ../../src/tango.hash
    params:
      - params.yaml:
          - log_level
    outs:
      - outputs/results

  # Clean up any leftover .tmp files from atomic writes interrupted mid-run.
  # No outs — pure side-effect. Runs after sweep completes because it deps on
  # outputs/results; DVC considers it stale after every successful sweep repro.
  clean:
    cmd: python -c "import pathlib; [f.unlink() for f in pathlib.Path('outputs/results').glob('*.tmp')]"
    deps:
      - outputs/results

  # Stage 3: aggregate per-design JSONs → parquet.
  summarize:
    cmd: python summarize.py
    deps:
      - summarize.py
      - common.py
      - outputs/results
    outs:
      - outputs/results.parquet

  # Stage 4: static + interactive plots for exploring the design space.
  # No lcoe_grid.png here — LCOE_USD_per_kWh is populated (DoubletEconomicComponent
  # is wired in), but an LCOE-colored grid isn't wired into plot.py yet; queued
  # as separate follow-up plotting work (see plot.py's module docstring).
  plot:
    cmd: python plot.py
    deps:
      - plot.py
      - common.py
      - outputs/results.parquet
    outs:
      - outputs/success_scatter.png
      - outputs/parallel_coordinates.png
      - outputs/parallel_coordinates.html
      - outputs/parallel_coordinates_qualified.html
