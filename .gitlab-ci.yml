default:
  tags:
    - gcp-runner
  image: ghcr.io/astral-sh/uv:python3.11-bookworm

workflow:
  auto_cancel:
    on_new_commit: interruptible

before_script:
  # print uv version to aid troubleshooting in case of failure
  - uv --version

stages:
  - test

test:
  stage: test
  interruptible: true
  script:
    - uv run pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
