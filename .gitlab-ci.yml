default:
  tags:
    - gcp-runner
  image: ghcr.io/astral-sh/uv:python3.11-bookworm

workflow:
  auto_cancel:
    on_new_commit: interruptible

before_script:
  # print uv version to aid troubleshooting in case of failure
  - uv --version

stages:
  - test
  - tag

lint:
  stage: test
  interruptible: true
  script:
    - uv run ruff check .
    - uv run mypy src/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

test:
  stage: test
  interruptible: true
  script:
    # Only tests/unit/ runs here — tests/regtest/ currently takes 1h+ and
    # exceeds the runner timeout (see tests/README.md and the "CI test
    # subset" note in docs/TANGO_vision_and_roadmap/README.md). The full suite
    # (tests/unit/ + tests/regtest/) still runs locally via the prek
    # pre-push hook, so regressions are caught before merge even though
    # this job doesn't cover them.
    - uv run pytest tests/unit -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# Third-party license gate for releases. Fails if any runtime dependency's
# license isn't allowed by tools/check_licenses.py (allowed license, or an
# entry in its REVIEWED_PACKAGES table). Resolving a failure means a person
# reviews the license and either replaces the dependency or adds a
# REVIEWED_PACKAGES entry with the reason, through a normal MR.
#
# Runs on the version-bump MR into main -- the only point where it can
# stop a release, since the pushed tag *is* the release (CONTRIBUTING.md §
# "Cutting an Internal (GEG-only) Release") -- and again on the release tag
# itself as a record of what shipped. licenses.json and the draw.io
# dependency tree are kept as artifacts for the reviewer.
license_check:
  stage: test
  interruptible: true
  script:
    - uv run --locked python tools/check_licenses.py --drawio tools/dependency_tree.drawio
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - tools/licenses.json
      - tools/dependency_tree.drawio
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# Automatically tag the source branch tip before it is deleted by the squash
# merge. This preserves CHANGELOG.md comparison links (see CONTRIBUTING.md §
# "Tagging deleted branches"). Runs only in merge-request pipelines, and only
# for topic branches (not develop / main).
tag_branch:
  stage: tag
  image: alpine:latest
  before_script:
    - apk add -q --no-cache git
  script:
    - BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    # Rewrite the remote URL to authenticate with a Project Access Token.
    # By default the git remote uses the CI_JOB_TOKEN credential, which GitLab
    # only grants read (clone/fetch) access for git operations. To push tags we
    # need write_repository permission, which requires a separate Project Access
    # Token stored as the CI/CD variable GITLAB_PUSH_TOKEN (see CONTRIBUTING.md
    # § "Tagging deleted branches" for setup instructions). The oauth2: prefix
    # is the standard username GitLab expects when authenticating with a PAT
    # over HTTPS.
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # Guard: if a newer commit was pushed while this pipeline was running,
    # skip tagging — the pipeline on that newer commit will tag correctly.
    - REMOTE_TIP=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
    - |
      if [ "$CI_COMMIT_SHA" != "$REMOTE_TIP" ]; then
        echo "Skipping tag: pipeline commit $CI_COMMIT_SHA is stale (branch tip is $REMOTE_TIP)."
        exit 0
      fi
    - git tag --force "bak/$BRANCH"
    - git push --force origin "refs/tags/bak/$BRANCH"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^(main|develop)$/'
